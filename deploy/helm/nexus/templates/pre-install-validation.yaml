# c0.x #A-3 + 1-1 + Phase D-1: pre-install validation job
# rejects unsafe NEXUS_POSTGRES_MAX_CONNS at install time. The
# chart's values.schema.json floors both Gateway and Worker
# blocks at minSafeMaxConns (default 8), but a chart-only schema
# miss (e.g. a typo'd key path) could let the secret pass without
# checks. This Job runs an inline shell stair-step that verifies
# both dependency.postgres.maxConns and worker.postgres.maxConns
# are inside [min, max] before the main Deployment ever applies.
#
# Failure path: exit non-zero → helm install/upgrade aborts with a
# helpful message pointing at the offending knob. The Deployment is
# not created until this job succeeds.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "nexus.fullname" . }}-install-validate
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "nexus.labels" . | nindent 4 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ template "nexus.serviceAccountName" . }}
      containers:
        - name: validate
          image: {{ include "nexus.image" . | quote }}
          imagePullPolicy: {{ include "nexus.imagePullPolicy" . }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              MIN={{ int (default 8 .Values.dependencies.postgres.minSafeMaxConns) }};
              MAX={{ int (default 64 .Values.dependencies.postgres.maxSafeMaxConns) }};
              WANT={{ int (default 8 .Values.dependencies.postgres.maxConns) }};
              repCount={{ int .Values.replicaCount }};
              echo "validating NEXUS_POSTGRES_MAX_CONNS floor=${MIN} ceiling=${MAX} want=${WANT} replicas=${repCount}";
              if [ "${WANT}" -lt "${MIN}" ]; then
                echo "ERROR: dependency.postgres.maxConns=${WANT} < minSafeMaxConns=${MIN}." >&2;
                echo "  c0.x #A-3 invariant: the AcceptInvite path needs 8 connections" >&2;
                echo "  per concurrent invite token, and lowering below the floor" >&2;
                echo "  re-introduces a deadlock between the FOR UPDATE row and" >&2;
                echo "  the same-transaction audit_log INSERT." >&2;
                exit 1;
              fi;
              if [ "${WANT}" -gt "${MAX}" ]; then
                echo "ERROR: dependency.postgres.maxConns=${WANT} > maxSafeMaxConns=${MAX}." >&2;
                echo "  total connection burn per cluster = ${WANT} * ${repCount} replicas" >&2;
                echo "  and Postgres server max_connections must always cover" >&2;
                echo "  migrations + replica probes + BI readers + this product." >&2;
                exit 1;
              fi;
              if [ $((WANT * repCount)) -gt 200 ]; then
                echo "WARNING: ${WANT} * ${repCount} = $((WANT * repCount)) > 200; confirm Postgres max_connections covers this." >&2;
              fi;
              # Phase D-1: independent verification of the Worker pool
              # so a typo in worker.postgres.* cannot ship an unsafe
              # configuration. The Gateway and Worker pools are sized
              # separately because lease acquisition grabs a
              # connection off the same pool that the cron runner
              # uses; an under-sized Worker pool will deadlock during
              # cron tick rather than at startup.
              WMIN={{ int (default 8 .Values.worker.postgres.minSafeMaxConns) }};
              WMAX={{ int (default 32 .Values.worker.postgres.maxSafeMaxConns) }};
              WWANT={{ int (default 16 .Values.worker.postgres.maxConns) }};
              wRepCount={{ int (default 1 .Values.worker.replicaCount) }};
              echo "validating worker Postgres maxConns floor=${WMIN} ceiling=${WMAX} want=${WWANT} replicas=${wRepCount}";
              if [ "${WWANT}" -lt "${WMIN}" ]; then
                echo "ERROR: worker.postgres.maxConns=${WWANT} < minSafeMaxConns=${WMIN}." >&2;
                echo "  Phase D-1 invariant: lease heartbeat needs a stable connection" >&2;
                echo "  and the benchmark scheduler ticks off the same pool." >&2;
                exit 1;
              fi;
              if [ "${WWANT}" -gt "${WMAX}" ]; then
                echo "ERROR: worker.postgres.maxConns=${WWANT} > maxSafeMaxConns=${WMAX}." >&2;
                echo "  reduce worker.replicaCount or raise worker.postgres.maxSafeMaxConns." >&2;
                exit 1;
              fi;
              if [ $((WWANT * wRepCount)) -gt 100 ]; then
                echo "WARNING: worker Postgres maxConns * worker replicaCount = $((WWANT * wRepCount)) > 100; verify max_connections." >&2;
              fi;
              # Phase D-1 total-connection verification.
              # The Postgres server's max_connections must cover:
              #   * Phase D-1 replica burn:
              #       gateway:  WANT  * repCount       connections
              #       worker:   WWANT * wRepCount      connections
              #       (each pod keeps a short-lived lease
              #        pinned connection that does not return
              #        until the pod terminates)
              #   * Migration job:    1 (one at a time, sequential)
              #   * Nexus CLI tools:  4 default (migrate, refresh,
              #                       eval-batch, harness)
              #   * Postgres superuser_reserved_connections:
              #       3 (default value; operators can raise it)
              #   * BI / analytics readers (Metabase, Grafana
              #     OAuth proxies, etc): 8 default
              #
              # Sum:  (WANT*repCount) +
              #       (WWANT*wRepCount) +
              #       migration (1) +
              #       CLI (4) +
              #       superuser_reserved (3) +
              #       BI readers (8) +
              #       safety headroom (12)
              #
              # Postgres server max_connections default is 100.
              # The conservative limit equation is:
              #   max_connections >= SUM
              # We assume the operator tuned max_connections
              # upward and gate at the documented 200 ceiling.
              SUM=$((WANT * repCount + WWANT * wRepCount + 1 + 4 + 3 + 8 + 12));
              echo "Phase D-1 total-connection verification: SUM=${SUM}"
              if [ "${SUM}" -gt 200 ]; then
                echo "ERROR: phase-d1 total=${SUM} > 200" >&2;
                echo "  This cluster would exhaust Postgres max_connections" >&2;
                echo "  during normal operation, including the lease-pinned" >&2;
                echo "  connection per Worker pod, the migration job held" >&2;
                echo "  by Helm's pre-upgrade hook, and Postgres's own" >&2;
                echo "  superuser_reserved_connections." >&2;
                echo "  Reduce gateway or worker replicas first; the next" >&2;
                echo "  knobs to tune are gateway.postgres.maxConns (down)" >&2;
                echo "  followed by worker.postgres.maxConns (down)." >&2;
                echo "  The ceiling is a fixed product spec, not a tuning" >&2;
                echo "  surface; raise Postgres server max_connections" >&2;
                echo "  per https://www.postgresql.org/docs/current/" >&2;
                echo "  runtime-config-connection.html." >&2;
                exit 1;
              fi;
              if [ "${SUM}" -gt 150 ]; then
                echo "WARNING: phase-d1 total=${SUM} is in the 150-200 band; reserve headroom for organic growth." >&2;
              fi;
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
