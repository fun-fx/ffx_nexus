apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexus.fullname" . }}-gateway
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nexus.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      annotations:
        # Roll pods when config/secret content changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "nexus.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nexus.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: nexus-gateway
          # Phase D-1 spec: image goes through the helper so
          # both roles see the exact same image+tag. A future
          # change that lets one Deployment drift is loud here.
          image: {{ include "nexus.image" . | quote }}
          imagePullPolicy: {{ include "nexus.imagePullPolicy" . }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # Gateway pods expose the data-plane listeners and the
          # console. Metrics port is exposed for Prometheus; the
          # egress / network policy must whitelist port 8080+8081
          # for ingress traffic, and 9090 for in-cluster scrapes.
          ports:
            - name: gateway
              containerPort: {{ .Values.ports.gateway }}
              protocol: TCP
            - name: console
              containerPort: {{ .Values.ports.console }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          # Phase D-1: Gateway pods disable the scheduler
          # leader-gate. The Worker pods acquire the lease and
          # tick; Gateway pods only serve traffic and run audit
          # pathway code paths. The NEXUS_ROLE marker is what
          # main.go's mode switch reads at startup.
          env:
            - name: NEXUS_ROLE
              value: gateway
            - name: NEXUS_SCHEDULER_ROLE_ENABLED
              value: "false"
            - name: NEXUS_POSTGRES_MAX_CONNS
              value: {{ .Values.dependencies.postgres.maxConns | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "nexus.fullname" . }}
            - secretRef:
                name: {{ include "nexus.secretName" . }}
            {{- with .Values.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          # Phase D-1: /readyz on the gateway means "we can serve
          # traffic". The probe points at the gateway port.
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.ports.gateway }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds | default 10 }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold | default 6 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if and .Values.config.metabase .Values.config.metabase.seedDir (not .Values.config.metabase.seedFromExisting) }}
            - name: metabase-seed
              mountPath: {{ .Values.config.metabase.seedDir | default "/etc/nexus/metabase/seed" }}
              readOnly: true
            {{- end }}
      volumes:
        # readOnlyRootFilesystem is on; give the process a writable scratch dir.
        - name: tmp
          emptyDir: {}
        {{- if and .Values.config.metabase .Values.config.metabase.seedDir (not .Values.config.metabase.seedFromExisting) }}
        # The seed ConfigMap contains 3 reference collections plus any
        # operator-supplied extras (config.metabase.extraSeeds). Boot-time
        # metabase bootstrap reads *.json here and registers each as a
        # Metabase "Nexus - <name>" collection + cards. The volume is
        # readOnly; the bootstrapper never writes here.
        - name: metabase-seed
          configMap:
            name: {{ include "nexus.fullname" . }}-metabase-seed
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
