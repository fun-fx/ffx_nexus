apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexus.fullname" . }}
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nexus.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll pods when config/secret content changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "nexus.selectorLabels" . | nindent 8 }}
        # The role label the NetworkPolicy set selects on.
        #
        # Every other workload in this chart already sets it — the migration
        # Job declares `component: migration`, the Grafana auth proxy declares
        # `component: grafana-auth-proxy` — and this Deployment was the one
        # that did not. The gateway and worker policies both select
        # `component: <role>`, so without it they matched no pod at all, while
        # the default-deny policy (podSelector: {}) matched this one. Under
        # mode=enforce that left the only pod that serves traffic with every
        # allow rule attached to a selector it did not satisfy.
        #
        # It goes here and NOT in nexus.selectorLabels, which feeds
        # .spec.selector above. A Deployment's selector is immutable, so
        # widening the helper would make `helm upgrade` fail on every existing
        # release. Pod template labels are free to grow; the selector must not.
        app.kubernetes.io/component: gateway
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nexus.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: nexus
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: gateway
              containerPort: {{ .Values.ports.gateway }}
              protocol: TCP
            - name: console
              containerPort: {{ .Values.ports.console }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "nexus.fullname" . }}
            - secretRef:
                name: {{ include "nexus.secretName" . }}
            {{- with .Values.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- /*
            Runtime proxy wiring for the gateway/worker pod.

            Two distinct intents lead to two distinct shapes:

              * providerEgress.mode == "in_cluster_only"
                — NO proxy env at all. Public destinations are
                refused in the runtime; the chart does not even
                give the gateway a path through a proxy because
                "in_cluster_only" is the operator's explicit
                promise that there is no public egress.

              * providerEgress.mode == "proxy"
                — HTTPS_PROXY/HTTP_PROXY both point at the
                proxy host the operator declared, plus a
                chart-composed NO_PROXY that keeps the local
                datastore traffic on a direct path. NO_PROXY
                is composed automatically; the operator does
                not override it. The composer is documented
                here because the failure shape (datastore
                egress quietly routing through the proxy) is
                one of the obvious ways this can fail with
                install success and runtime breakage.

              * legacy networkPolicy.egress.proxy.enabled=true
                — same shape as providerEgress.mode=proxy.
                The alias will go away in the next minor;
                we keep its behaviour identical here.

            NO_PROXY automatic composition:
              * loopback (127.0.0.1, ::1)
              * localhost
              * kubernetes in-cluster DNS (.svc,
                .svc.cluster.local, .cluster.local)
              * configured in-cluster datastore hosts
                (dependencies.{postgres,clickhouse,redis}.host)
                when the chart knows about them at render time
              * the user-added networkPolicy.providerEgress.proxy
                .noProxyExtras list, for operators who run
                Nexus alongside an in-cluster Service the chart
                does not know about

            We deliberately do NOT include 0.0.0.0/0 in NO_PROXY.
            The standard Kubernetes NetworkPolicy plain cannot
            express FQDN allow-lists, and the proxy is the
            place where external FQDN rules live. Letting "do
            not proxy anything" become a chart default would
            double-route the proxy and silently open every
            outbound socket to bypass it.
          */}}
          {{- $proxyURL := "" }}
          {{- $noProxy  := "" }}
          {{- $wantsProxy := false }}
          {{- if eq .Values.networkPolicy.providerEgress.mode "proxy" }}
          {{-   if .Values.networkPolicy.providerEgress.proxy.host }}
          {{-     $proxyURL = printf "http://%s:%d" .Values.networkPolicy.providerEgress.proxy.host .Values.networkPolicy.providerEgress.proxy.port }}
          {{-     $wantsProxy = true }}
          {{-   end }}
          {{- else if .Values.networkPolicy.egress.proxy.enabled }}
          {{-   if .Values.networkPolicy.egress.proxy.host }}
          {{-     $proxyURL = printf "http://%s:%d" .Values.networkPolicy.egress.proxy.host .Values.networkPolicy.egress.proxy.port }}
          {{-     $wantsProxy = true }}
          {{-   end }}
          {{- end }}
          {{- if $wantsProxy }}
          {{-   $noProxyParts := list "127.0.0.1" "::1" "localhost" ".svc" ".svc.cluster.local" ".cluster.local" }}
          {{-   if .Values.dependencies.postgres.enabled }}
          {{-     if .Values.dependencies.postgres.host }}
          {{-       $noProxyParts = append $noProxyParts .Values.dependencies.postgres.host }}
          {{-     end }}
          {{-   end }}
          {{-   if .Values.dependencies.clickhouse.enabled }}
          {{-     if .Values.dependencies.clickhouse.host }}
          {{-       $noProxyParts = append $noProxyParts .Values.dependencies.clickhouse.host }}
          {{-     end }}
          {{-   end }}
          {{-   if .Values.dependencies.redis.enabled }}
          {{-     if .Values.dependencies.redis.host }}
          {{-       $noProxyParts = append $noProxyParts .Values.dependencies.redis.host }}
          {{-     end }}
          {{-   end }}
          {{-   range .Values.networkPolicy.providerEgress.proxy.noProxyExtras }}
          {{-     $noProxyParts = append $noProxyParts . }}
          {{-   end }}
          {{-   $noProxy = join "," (uniq $noProxyParts) }}
          {{- end }}
          {{- if or $wantsProxy $.Values.extraEnv }}
          env:
            {{- if $wantsProxy }}
            - name: HTTPS_PROXY
              value: {{ $proxyURL | quote }}
            - name: HTTP_PROXY
              value: {{ $proxyURL | quote }}
            - name: NO_PROXY
              value: {{ $noProxy | quote }}
            - name: http_proxy
              value: {{ $proxyURL | quote }}
            - name: https_proxy
              value: {{ $proxyURL | quote }}
            - name: no_proxy
              value: {{ $noProxy | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if and .Values.config.metabase .Values.config.metabase.seedDir (not .Values.config.metabase.seedFromExisting) }}
            - name: metabase-seed
              mountPath: {{ .Values.config.metabase.seedDir | default "/etc/nexus/metabase/seed" }}
              readOnly: true
            {{- end }}
      volumes:
        # readOnlyRootFilesystem is on; give the process a writable scratch dir.
        - name: tmp
          emptyDir: {}
        {{- if and .Values.config.metabase .Values.config.metabase.seedDir (not .Values.config.metabase.seedFromExisting) }}
        # The seed ConfigMap contains 3 reference collections plus any
        # operator-supplied extras (config.metabase.extraSeeds). Boot-time
        # metabase bootstrap reads *.json here and registers each as a
        # Metabase "Nexus - <name>" collection + cards. The volume is
        # readOnly; the bootstrapper never writes here.
        - name: metabase-seed
          configMap:
            name: {{ include "nexus.fullname" . }}-metabase-seed
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
