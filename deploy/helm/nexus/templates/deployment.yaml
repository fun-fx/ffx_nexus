apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexus.fullname" . }}
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nexus.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll pods when config/secret content changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "nexus.selectorLabels" . | nindent 8 }}
        # The role label the NetworkPolicy set selects on.
        #
        # Every other workload in this chart already sets it — the migration
        # Job declares `component: migration`, the Grafana auth proxy declares
        # `component: grafana-auth-proxy` — and this Deployment was the one
        # that did not. The gateway and worker policies both select
        # `component: <role>`, so without it they matched no pod at all, while
        # the default-deny policy (podSelector: {}) matched this one. Under
        # mode=enforce that left the only pod that serves traffic with every
        # allow rule attached to a selector it did not satisfy.
        #
        # It goes here and NOT in nexus.selectorLabels, which feeds
        # .spec.selector above. A Deployment's selector is immutable, so
        # widening the helper would make `helm upgrade` fail on every existing
        # release. Pod template labels are free to grow; the selector must not.
        app.kubernetes.io/component: gateway
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nexus.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: nexus
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: gateway
              containerPort: {{ .Values.ports.gateway }}
              protocol: TCP
            - name: console
              containerPort: {{ .Values.ports.console }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "nexus.fullname" . }}
            - secretRef:
                name: {{ include "nexus.secretName" . }}
            {{- with .Values.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if and .Values.config.metabase .Values.config.metabase.seedDir (not .Values.config.metabase.seedFromExisting) }}
            - name: metabase-seed
              mountPath: {{ .Values.config.metabase.seedDir | default "/etc/nexus/metabase/seed" }}
              readOnly: true
            {{- end }}
      volumes:
        # readOnlyRootFilesystem is on; give the process a writable scratch dir.
        - name: tmp
          emptyDir: {}
        {{- if and .Values.config.metabase .Values.config.metabase.seedDir (not .Values.config.metabase.seedFromExisting) }}
        # The seed ConfigMap contains 3 reference collections plus any
        # operator-supplied extras (config.metabase.extraSeeds). Boot-time
        # metabase bootstrap reads *.json here and registers each as a
        # Metabase "Nexus - <name>" collection + cards. The volume is
        # readOnly; the bootstrapper never writes here.
        - name: metabase-seed
          configMap:
            name: {{ include "nexus.fullname" . }}-metabase-seed
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
