{{/*
  Grafana dashboard toggle (config.grafana.*).
  Renders three bundled reference GrafanaDashboard CRs (01-overview,
  02-llm-spend, 03-eval-quality) sourced from files/grafana-dashboards/.
  Toggling on with `enabled: true` also lets the operator optionally
  enable alert routing via a Cozystack-managed Grafana instance.

  Cross-namespace name safety:
  --------------------------------------------------------------------------
  GrafanaDashboard CR names must be unique WITHIN a single Grafana instance's
  scope of reconciliation — and two CRs in different namespaces but with the
  same `metadata.name` are treated as the same logical dashboard by the
  grafana-operator. The legacy path (deploy/cozystack/09-grafana-dashboards.yaml
  in this repo's ops neighbour) used bare names like `nexus-01-overview` in the
  `tenant-root` namespace; to coexist with that legacy apply AND make this
  chart's CRs an independently-removable source of truth, we prefix every
  name with the release's full Helm name. After migrating off the legacy
  apply path, the prefix can be dropped by setting `config.grafana.namePrefix`
  to "" — but for now operators need both to coexist.

  Console link path:
  --------------------------------------------------------------------------
  The console's `/api/ui/observability` endpoint (PR #241) hardcodes the
  bare-name path `/d/nexus-01-overview/nexus-01-overview`. That path matches
  the legacy operator-installed dashboards. This chart emits prefixed CRs,
  so the console's link is correct against the legacy dashboards — and the
  chart-managed dashboards render at `/d/<fullName>-01-overview/fullName-01-overview`
  for anyone who explicitly wants the chart-managed copy (browse the folder
  in Grafana's sidebar to find it).
*/}}

{{- if and .Values.config.grafana .Values.config.grafana.enabled .Values.config.grafana.dashboardsEnabled }}

{{- $folder := .Values.config.grafana.folder | default "Nexus" }}
{{- $selector := .Values.config.grafana.instanceSelector.matchLabels }}
{{- $prefix := .Values.config.grafana.namePrefix | default "chart-" }}

{{/* ---------- ConfigMap holding each dashboard JSON ---------- */}}
{{- range $name, $path := dict "01-nexus-overview.json" "files/grafana-dashboards/01-nexus-overview.json" "02-llm-spend.json" "files/grafana-dashboards/02-llm-spend.json" "03-eval-quality.json" "files/grafana-dashboards/03-eval-quality.json" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $prefix }}dashboard-{{ trimSuffix ".json" $name }}
  labels:
    grafana_dashboard: "1"
    {{- include "nexus.labels" $ | nindent 4 }}
data:
  {{ $name }}: |-
{{ $.Files.Get $path | indent 4 }}
---
{{- end }}

{{/* ---------- Operator-managed GrafanaDashboard CRs ---------- */}}
{{- range $name, $uid := dict "01-nexus-overview.json" "nexus-01-overview" "02-llm-spend.json" "nexus-02-llm-spend" "03-eval-quality.json" "nexus-03-eval-quality" }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: {{ $prefix }}{{ $uid }}
  labels:
    {{- include "nexus.labels" $ | nindent 4 }}
spec:
  resyncPeriod: 5m
  instanceSelector:
    matchLabels:
      {{- range $k, $v := $selector }}
      {{ $k }}: {{ $v }}
      {{- end }}
  folder: {{ $folder }}
  configMapRef:
    name: {{ $prefix }}dashboard-{{ trimSuffix ".json" $name }}
    key: {{ $name }}
---
{{- end }}

{{/* ---------- Optional: alert contact point + OTLP rule group ---------- */}}
{{- if and .Values.config.grafana.alertsEnabled .Values.config.grafana.folderUID }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaContactPoint
metadata:
  name: {{ include "nexus.fullname" . }}-alerts
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
spec:
  name: {{ include "nexus.fullname" . }}-alerts-webhook
  type: webhook
  resyncPeriod: 30s
  instanceSelector:
    matchLabels:
      {{- range $k, $v := $selector }}
      {{ $k }}: {{ $v }}
      {{- end }}
  settings:
    # The contact-point's settings are a free-form object matching the contact
    # type. The webhook receiver URL is intentionally left blank by default;
    # operators must override `.Values.config.grafana.alertsWebhook` before
    # applying with alertsEnabled: true — the chart emits a validation error
    # in NOTES.txt when this is unset.
    url: {{ .Values.config.grafana.alertsWebhook | default "http://failover-echo.tenant-nexus.svc:8080/alert" }}
    httpMethod: POST
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: {{ include "nexus.fullname" . }}-otlp-alerts
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
spec:
  folderUID: {{ .Values.config.grafana.folderUID }}
  interval: 1m
  resyncPeriod: 30s
  rules:
    - uid: nex-otlp-4xx-sustained
      title: Nexus OTLP exporter — sustained 4xx from collector
      condition: A
      notificationSettings:
        receiver: {{ include "nexus.fullname" . }}-alerts-webhook
        group_by:
          - grafana_folder
          - alertname
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
      data:
        - refId: A
          datasourceUid: vm-default
          relativeTimeRange:
            from: 300
            to: 0
          model:
            expr: sum(increase(nexus_otlp_export_requests_total{status=~"4.."}[5m]))
            instant: true
            refId: A
      for: 5m
      noDataState: OK
      execErrState: Alerting
{{- end }}

{{- end }}
