apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nexus.fullname" . }}
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
data:
  {{- with .Values.config.gatewayAddr }}
  NEXUS_GATEWAY_ADDR: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.consoleAddr }}
  NEXUS_CONSOLE_ADDR: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.publicGatewayUrl }}
  NEXUS_PUBLIC_GATEWAY_URL: {{ . | quote }}
  {{- end }}
  {{- /* Public console origin. Roots the invite URLs an admin copies out
       of the Users page and is required for LangSmith automation webhook
       registration. Previously absent from this ConfigMap entirely, which
       meant operators had to reach for extraEnv to set it. */}}
  {{- with .Values.config.publicBaseUrl }}
  NEXUS_PUBLIC_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- /* Browser-reachable base URL of the customer's own Grafana. Consumed
       by GET /api/ui/observability so the console can render an "Open in
       Grafana" link. Empty ⇒ the endpoint reports no Grafana and the
       console omits the link. Nexus never calls Grafana server-side. */}}
  {{- with .Values.config.publicGrafanaUrl }}
  NEXUS_PUBLIC_GRAFANA_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.publicWebOrigins }}
  # Operator-supplied web-origin allow-list for the console CSP
  # `connect-src` directive. Replaces the hardcoded *.ffx.ai list
  # previously baked into internal/console/security.go so multi-tenant
  # Helm deploys do not need a code change to admit their own origin.
  NEXUS_PUBLIC_WEB_ORIGINS: {{ join "," . | quote }}
  {{- end }}
  {{- with .Values.config.egressTenantAllowedCidrs }}
  # Private ranges that destinations configured through the API may reach.
  # Empty (the default) means public internet only for those destinations.
  # Link-local is never reachable regardless of this value.
  NEXUS_EGRESS_TENANT_ALLOWED_CIDRS: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.upstreamTimeout }}
  NEXUS_UPSTREAM_TIMEOUT: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.openaiBaseUrl }}
  OPENAI_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.keyMode }}
  NEXUS_KEY_MODE: {{ . | quote }}
  {{- end }}

  {{- /* Docs tree served by /api/docs and rendered at /docs in the
       console. The image bundles /etc/nexus/docs (see Dockerfile).
       Override here for an extension overlay — ConfigMap mount,
       extra runbooks, a docs fork — without rebuilding the image.
       Empty/unset leaves the bundled tree in place. */}}
  NEXUS_DOCS_DIR: {{ .Values.config.docsDir | default "/etc/nexus/docs" | quote }}

  NEXUS_ALLOW_SIGNUP: {{ .Values.config.allowSignup | quote }}

  {{- /* Quality-aware routing */}}
  {{- with .Values.config.routeGroups }}
  NEXUS_ROUTE_GROUPS: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.routeWQuality }}
  NEXUS_ROUTE_W_QUALITY: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.routeWCost }}
  NEXUS_ROUTE_W_COST: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.routeWLatency }}
  NEXUS_ROUTE_W_LATENCY: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.routeWindow }}
  NEXUS_ROUTE_WINDOW: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.routeRefresh }}
  NEXUS_ROUTE_REFRESH: {{ . | quote }}
  {{- end }}
  NEXUS_ROUTE_LOAD_BALANCE: {{ .Values.config.routeLoadBalance | quote }}

  {{- /* Inline guardrails */}}
  NEXUS_GUARDRAILS_ENABLED: {{ .Values.config.guardrails.enabled | quote }}
  NEXUS_GUARDRAILS_BLOCK_PII_INPUT: {{ .Values.config.guardrails.blockPiiInput | quote }}
  NEXUS_GUARDRAILS_REDACT_PII_OUTPUT: {{ .Values.config.guardrails.redactPiiOutput | quote }}
  NEXUS_GUARDRAILS_MAX_INPUT_CHARS: {{ .Values.config.guardrails.maxInputChars | quote }}
  {{- with .Values.config.guardrails.denyPatterns }}
  NEXUS_GUARDRAILS_DENY_PATTERNS: {{ . | quote }}
  {{- end }}
  NEXUS_GUARDRAILS_VALIDATE_JSON_OUTPUT: {{ .Values.config.guardrails.validateJsonOutput | quote }}

  {{- /* Self-correction */}}
  NEXUS_SELF_CORRECTION_ENABLED: {{ .Values.config.selfCorrection.enabled | quote }}
  NEXUS_SELF_CORRECTION_MAX_RETRIES: {{ .Values.config.selfCorrection.maxRetries | quote }}

  {{- /* Local SLM judge */}}
  {{- with .Values.config.judge.baseUrl }}
  NEXUS_JUDGE_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.judge.model }}
  NEXUS_JUDGE_MODEL: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.judge.sampleRate }}
  NEXUS_EVAL_SAMPLE_RATE: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.judge.workers }}
  NEXUS_EVAL_WORKERS: {{ . | quote }}
  {{- end }}

  {{- /* External Python eval sidecar */}}
  {{- with .Values.config.evalService.url }}
  NEXUS_EVAL_SERVICE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.evalService.metrics }}
  NEXUS_EVAL_SERVICE_METRICS: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.evalService.timeout }}
  NEXUS_EVAL_SERVICE_TIMEOUT: {{ . | quote }}
  {{- end }}

  {{- /* Plugin-only mode: skip seeded heuristic profiles (PII / Completeness).
       Operators flipping this on want scoring to come exclusively from
       external EvalPlugins (LangSmith, Langfuse, Datadog, Confident AI, …). */}}
  NEXUS_EVAL_PLUGIN_ONLY: {{ .Values.config.evalPluginOnly | default false | quote }}

  {{- /* Destructive companion: paired with NEXUS_EVAL_PLUGIN_ONLY, hard-deletes
       the well-known seed rows (default-pii, default-completeness,
       default-judge, default-remote) on every boot. The two-flag gate keeps
       seed-suppression and row-deletion as separable intentional actions. */}}
  NEXUS_EVAL_PURGE_LEGACY_PROFILES_ON_BOOT: {{ .Values.config.purgeLegacyProfilesOnBoot | default false | quote }}

  {{- /* Semantic cache */}}
  NEXUS_SEMANTIC_CACHE_ENABLED: {{ .Values.config.semanticCache.enabled | quote }}
  {{- with .Values.config.semanticCache.ttl }}
  NEXUS_SEMANTIC_CACHE_TTL: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.semanticCache.threshold }}
  NEXUS_SEMANTIC_CACHE_THRESHOLD: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.semanticCache.maxEntries }}
  NEXUS_SEMANTIC_CACHE_MAX_ENTRIES: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.embeddings.url }}
  NEXUS_EMBEDDINGS_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.embeddings.model }}
  NEXUS_EMBEDDINGS_MODEL: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.embeddings.timeout }}
  NEXUS_EMBEDDINGS_TIMEOUT: {{ . | quote }}
  {{- end }}

  {{- /* Observability adapter toggle (V3): otlp exporter + Prometheus /metrics */}}
  NEXUS_OTLP_ENABLED: {{ .Values.config.otlp.enabled | quote }}
  {{- with .Values.config.otlp.endpoint }}
  NEXUS_OTLP_ENDPOINT: {{ . | quote }}
  {{- end }}
  {{- /* Service-scoped metrics surface (V3). When `metrics.enabled` is true,
       bind a Prometheus text-format export at `metrics.host:metrics.port` so
       an in-cluster scraper (Prometheus, VictoriaMetrics, vmagent) can pull
       /metrics. Independent of OTLP: setting `metrics.enabled: true` makes
       the scrape surface available WITHOUT enabling OTLP forwarding.

       NEXUS_METRICS_ADDR is emitted exactly ONCE. `metrics.enabled` wins
       because it is the only path that also declares the container port and
       the Service port; `config.metricsAddr` is the raw escape hatch for
       binding somewhere the Service does not publish. Emitting both (the
       previous behaviour) produced a duplicate key in this ConfigMap's data
       map, so which address won depended on YAML parse order. */}}
  {{- if .Values.metrics.enabled }}
  {{- $addr := "" }}
  {{- if .Values.metrics.host }}{{ $addr = printf "%s:%d" .Values.metrics.host (int .Values.metrics.port) }}{{ else }}{{ $addr = printf ":%d" (int .Values.metrics.port) }}{{ end }}
  NEXUS_METRICS_ADDR: {{ $addr | quote }}
  {{- else }}
  {{- with .Values.config.metricsAddr }}
  NEXUS_METRICS_ADDR: {{ . | quote }}
  {{- end }}
  {{- end }}

  {{- /* V4 failover alert sinks */}}
  {{- with .Values.config.failoverWebhook }}
  NEXUS_FAILOVER_WEBHOOK: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.failoverSlack }}
  NEXUS_FAILOVER_SLACK_WEBHOOK: {{ . | quote }}
  {{- end }}
  {{- if ne .Values.config.failoverAlertCooldown "0s" }}
  NEXUS_FAILOVER_ALERT_COOLDOWN: {{ .Values.config.failoverAlertCooldown | quote }}
  {{- end }}

  {{- /* OIDC / SSO (Keycloak or any compliant IdP). Four env vars:
        NEXUS_SSO_ISSUER, NEXUS_SSO_CLIENT_ID, NEXUS_SSO_REDIRECT_URL,
        NEXUS_SSO_LABEL. The client secret lives in Secrets (not ConfigMap).
        Empty issuer disables the flow (SSOConfig.Enabled() returns false and
        /api/auth/sso/* routes are absent). Wrap in `with .Values.config.sso`
        to stay safe against partial overrides that omit the block. */}}
  {{- with .Values.config.sso }}
  {{- with .issuer }}
  NEXUS_SSO_ISSUER: {{ . | quote }}
  {{- end }}
  {{- with .clientId }}
  NEXUS_SSO_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- with .redirectUrl }}
  NEXUS_SSO_REDIRECT_URL: {{ . | quote }}
  {{- end }}
  {{- with .label }}
  NEXUS_SSO_LABEL: {{ . | quote }}
  {{- end }}
  {{- end }}

  {{- /* Metabase BI adapter — empty url field means the adapter is off.
       Wrap in `with .Values.config.metabase` so a nil map (sub-chart hidden
       by values flag, or partial-overrides via `helm install -f …`) does
       not blow up the template. */}}
  {{- with .Values.config.metabase }}
  {{- with .url }}
  NEXUS_METABASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .user }}
  NEXUS_METABASE_USER: {{ . | quote }}
  {{- end }}
  {{- with .password }}
  NEXUS_METABASE_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .clickhouseUrl }}
  NEXUS_METABASE_CLICKHOUSE_URL: {{ . | quote }}
  {{- end }}
  {{- with .postgresUrl }}
  NEXUS_METABASE_POSTGRES_URL: {{ . | quote }}
  {{- end }}
  {{- with .seedDir }}
  NEXUS_METABASE_SEED_DIR: {{ . | quote }}
  {{- end }}
  {{- with .healthTimeout }}
  NEXUS_METABASE_HEALTH_TIMEOUT: {{ . | quote }}
  {{- end }}
  {{- with .requestTimeout }}
  NEXUS_METABASE_REQUEST_TIMEOUT: {{ . | quote }}
  {{- end }}
  {{- end }}

  {{- /* Invite email transport. Provider-neutral: `resend` (HTTP API) or
       `smtp` (any RFC 5321 relay the customer already runs). Every field is
       optional — wrap in `with .Values.config.email` so a nil map (partial
       overrides via `helm install -f …`) does not blow up the template.

       Deliberately NO default fromAddress. A self-hosted install must send
       from a domain the CUSTOMER controls and has SPF/DKIM for; a vendor
       default meant invite mail was issued from a domain the customer could
       not authenticate, so it silently landed in spam. With the whole block
       empty the transport is off and invites still work through the copyable
       URL in the admin console.

       Secrets (Resend API key, SMTP password) are rendered into the Secret,
       never here. */}}
  {{- with .Values.config.email }}
  {{- with .provider }}
  NEXUS_EMAIL_PROVIDER: {{ . | quote }}
  {{- end }}
  {{- with .fromAddress }}
  NEXUS_EMAIL_FROM_ADDRESS: {{ . | quote }}
  {{- end }}
  {{- with .requestTimeout }}
  NEXUS_EMAIL_REQUEST_TIMEOUT: {{ . | quote }}
  {{- end }}
  {{- with .publicBaseUrl }}
  NEXUS_EMAIL_PUBLIC_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .resend }}
  {{- with .apiBaseUrl }}
  NEXUS_RESEND_API_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- with .smtp }}
  {{- with .host }}
  NEXUS_SMTP_HOST: {{ . | quote }}
  {{- end }}
  {{- with .port }}
  NEXUS_SMTP_PORT: {{ . | quote }}
  {{- end }}
  {{- with .username }}
  NEXUS_SMTP_USERNAME: {{ . | quote }}
  {{- end }}
  {{- with .encryption }}
  NEXUS_SMTP_ENCRYPTION: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- end }}

  {{- /* V5 high-concurrency tuning: GOMEMLIMIT soft memory cap + GOGC.
       GOMEMLIMIT is *advisory* — Go's GC uses it to bias toward reclaiming
       memory earlier under pressure instead of letting RSS balloon. We
       express it as a fraction of the container memory limit so that
       horizontal autoscaling doesn't require a configmap edit per pod.
       Setting to "" (the default) leaves both values unset, which means
       "no advisory". The `with .Values.config.runtime` wrapper protects
       against partial-overrides that omit the runtime block. */}}
  {{- with .Values.config.runtime }}
  {{- with .gomemlimit }}
  GOMEMLIMIT: {{ . | quote }}
  {{- end }}
  {{- with .gogc }}
  GOGC: {{ . | quote }}
  {{- end }}
  {{- end }}

  {{- /* V5 per-vkey concurrency tuning */}}
  {{- if gt (int .Values.config.maxConcurrentPerKey) 0 }}
  NEXUS_MAX_CONCURRENT_PER_KEY: {{ .Values.config.maxConcurrentPerKey | quote }}
  {{- end }}
