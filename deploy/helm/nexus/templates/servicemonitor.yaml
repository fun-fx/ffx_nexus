{{- /* A ServiceMonitor needs BOTH a metrics port to scrape (metrics.enabled,
     which declares the container + Service port) and an operator to consume
     the CR (metrics.serviceMonitor.enabled). Previously only the first was
     checked, so every cluster with metrics on got a ServiceMonitor whether or
     not it ran the Prometheus Operator - on a cluster without the CRD that
     fails the whole release with "no matches for kind ServiceMonitor", and
     the documented serviceMonitor.enabled flag did nothing. */}}
{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled -}}
{{- $fullName := include "nexus.fullname" . -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
  {{- with .Values.metrics.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "nexus.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: {{ .Values.metrics.path | default "/metrics" }}
      interval: {{ .Values.metrics.serviceMonitor.interval | default "30s" }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout | default "10s" }}
      {{- with .Values.metrics.serviceMonitor.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.metrics.serviceMonitor.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}
