{{- /*
  Enterprise-profile validation deliberately sits OUTSIDE the mode==enforce
  guard below.

  Every other check in this file is inside that guard, which made
  networkPolicy.mode=disabled a single switch that skipped all of them —
  including the enforcementAcknowledged requirement. An enterprise operator
  who set mode=disabled got no policies, no acknowledgement prompt and no
  error: the strictest profile silently produced the weakest result, and the
  more guards were added inside the guard, the more mode=disabled bypassed.

  values.yaml already describes this refusal ("schema and validation reject
  disabled in profile=enterprise"), and both upgrade-rehearsal scripts
  explicitly install with profile=development because they expect it, so this
  reconciles the template with what the rest of the chart states.

  The conditional lives here rather than in values.schema.json because Helm
  reports a schema violation as "Must not be valid against schema" against
  the offending path, which tells an operator nothing about which value to
  change. The schema still pins the value sets so a typo like mode=Enforce
  cannot silently disable enforcement.
*/}}
{{- if eq .Values.networkPolicy.profile "enterprise" }}
{{- if ne .Values.networkPolicy.mode "enforce" }}
{{- fail (printf "D-2b networkPolicy: profile=enterprise requires networkPolicy.mode=enforce, but mode=disabled was requested (got %q). mode=disabled renders no NetworkPolicy at all, so the enterprise profile would claim enforcement while allowing unrestricted pod egress. Set networkPolicy.profile=development if you intend to run without policy enforcement." .Values.networkPolicy.mode) }}
{{- end }}
{{- end }}
{{- if eq .Values.networkPolicy.mode "enforce" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nexus.fullname" . }}-default-deny
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
    app.kubernetes.io/component: default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
{{- if eq .Values.networkPolicy.profile "enterprise" }}
{{- if not .Values.networkPolicy.enforcementAcknowledged }}
{{- fail "D-2b networkPolicy: enterprise profile requires networkPolicy.enforcementAcknowledged=true. The chart explicitly requires the operator to acknowledge that NetworkPolicy enforcement can break cluster ingress if peer lists are misconfigured." }}
{{- end }}
{{- $sel := .Values.networkPolicy.postgres.selector.enabled }}
{{- $cidr := .Values.networkPolicy.postgres.cidr.enabled }}
{{- if and (not $sel) (not $cidr) }}
{{- fail "D-2b networkPolicy.postgres: enterprise profile requires either networkPolicy.postgres.selector.enabled=true (in-cluster operator Postgres) OR networkPolicy.postgres.cidr.enabled=true (managed/external Postgres CIDR+port). Both false is fail-closed." }}
{{- end }}
{{- if and $sel $cidr }}
{{- fail "D-2b networkPolicy.postgres: enterprise profile allows only one Postgres target mode. Set networkPolicy.postgres.selector.enabled=true OR networkPolicy.postgres.cidr.enabled=true, not both." }}
{{- end }}
{{- /*
  Features that talk to something off-cluster need a way out through the
  default-deny policy. Under profile=enterprise there are exactly two: the
  egress proxy, or a declared per-target namespace.

  With neither, the install succeeds and the feature is broken at runtime —
  SSO redirects the operator to an issuer the pod cannot reach, so login
  fails with a timeout that looks like an outage rather than a
  misconfiguration. Refusing at template time costs one clear error instead.

  Note what this does NOT do: it does not require a proxy. Declaring
  serviceTargets.<feature>.namespace is a complete answer, so operators who
  route egress themselves are unaffected. That distinction matters —
  mutation_test.py's M1 and M4 assert that SSO and emailResend render with
  the proxy disabled, and they pass because both declare a namespace. The
  rule is "no egress path at all", not "no proxy".
*/}}
{{- if not .Values.networkPolicy.egress.proxy.enabled }}
{{- $unreachable := list }}
{{- if and .Values.features.sso (not .Values.serviceTargets.sso.namespace) }}
{{- $unreachable = append $unreachable "features.sso (declare serviceTargets.sso.namespace)" }}
{{- end }}
{{- if and .Values.features.emailResend (not .Values.serviceTargets.resend.namespace) }}
{{- $unreachable = append $unreachable "features.emailResend (declare serviceTargets.resend.namespace)" }}
{{- end }}
{{- if $unreachable }}
{{- fail (printf "D-2b networkPolicy: profile=enterprise refuses external features without an egress proxy unless each declares its own egress target, and these have neither: %s. Either set networkPolicy.egress.proxy.enabled=true (with networkPolicy.egress.proxy.namespace), or declare the per-feature namespace shown above. Left as-is the default-deny policy would render, the release would install, and the feature would fail at runtime with no route out of the pod." (join "; " $unreachable)) }}
{{- end }}
{{- end }}
{{- end }}
{{- if eq .Values.networkPolicy.profile "enterprise" }}
{{- if .Values.networkPolicy.postgres.selector.enabled }}
{{- if not .Values.networkPolicy.postgres.selector.namespace }}
{{- fail "D-2b networkPolicy.postgres.selector: profile=enterprise selector mode requires networkPolicy.postgres.selector.namespace (the namespace where the Postgres Service lives). Empty would silently allow cluster-wide egress to the matched podSelector." }}
{{- end }}
{{- end }}
{{- end }}
{{- $metricsPort := .Values.metrics.port }}
{{- $dnsPort := .Values.networkPolicy.dns.matchPorts }}
{{- $dnsProto := .Values.networkPolicy.dns.matchProtocols }}
{{- /*
  dnsPeers: list of {namespaceSelector, podSelector} pairs
  derived from the chart-side networkPolicy.dns.nameservers.
  Nameservers are cluster CoreDNS ClusterIPs and resolve
  in any namespace, so we filter on podSelector=k8s-app=kube-dns
  within the kube-system namespace.
*/}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nexus.fullname" . }}-gateway-ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nexus.fullname" . }}-gateway
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "nexus.name" . }}
      app.kubernetes.io/component: gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- range $ns := .Values.networkPolicy.ingressController.namespaces }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns }}
      ports:
        {{- range $p := $.Values.networkPolicy.ingressController.matchPorts }}
        - protocol: TCP
          port: {{ $p }}
        {{- end }}
    {{- end }}
    {{- range $ns := .Values.networkPolicy.prometheus.namespaces }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns }}
      ports:
        - protocol: TCP
          port: {{ $metricsPort }}
    {{- end }}
  egress:
    # DNS — kubelet/CoreDNS inside kube-system
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        {{- range $p := $dnsPort }}
        {{- range $dnsProto }}
        - protocol: {{ . }}
          port: {{ $p }}
        {{- end }}
        {{- end }}
    {{- if and .Values.dependencies.postgres.host .Values.networkPolicy.postgres.selector.enabled }}
    # Postgres egress — selector mode (in-cluster operator Postgres)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.postgres.selector.namespace }}
        - podSelector:
            matchLabels:
              {{- range $k, $v := .Values.networkPolicy.postgres.selector.matchLabels }}
              {{ $k }}: {{ $v }}
              {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.dependencies.postgres.port }}
    {{- end }}
    {{- if and .Values.dependencies.postgres.host .Values.networkPolicy.postgres.cidr.enabled }}
    # Postgres egress — CIDR mode (managed/external Postgres)
    - to:
        {{- range $c := .Values.networkPolicy.postgres.cidr.cidrs }}
        - ipBlock:
            cidr: {{ $c }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.postgres.cidr.port }}
    {{- end }}
    {{- /* Redis egress — feature-gated (rate-limit-redis). The chart sets
       the same selector/CIDR dual-mode pattern as Postgres: in-cluster
       operator OR managed/external ipBlock. The selector approach
       reads `dependencies.redis.selector.{matchLabels, namespace}`;
       the CIDR approach reads `dependencies.redis.cidr.{cidrs, port}`. */}}
    {{- if .Values.features.rateLimitRedis }}
      {{- if and .Values.dependencies.redis.host .Values.dependencies.redis.namespace }}
    # Redis egress — selector mode (in-cluster operator Redis).
    # Uses the SAME selector pattern as Postgres but
    # keyed off `dependencies.redis.namespace` for
    # backwards-compatible values. A future schema major
    # version may migrate this to `redis.selector.*`
    # like Postgres has.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.dependencies.redis.namespace }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: {{ .Values.dependencies.redis.port }}
      {{- end }}
    {{- end }}
    {{- if .Values.networkPolicy.egress.proxy.enabled }}
    # Egress proxy
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.proxy.namespace }}
        {{- if gt (len .Values.networkPolicy.egress.proxy.podSelector) 0 }}
        - podSelector:
            matchLabels:
              {{- range $k, $v := .Values.networkPolicy.egress.proxy.podSelector }}
              {{ $k }}: {{ $v }}
              {{- end }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.proxy.port }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nexus.fullname" . }}-migration-egress
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "nexus.name" . }}
      app.kubernetes.io/component: migration
  policyTypes:
    - Egress
  egress:
    # DNS — resolved against the same chart-side peer as Gateway/Worker
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        {{- range $p := $dnsPort }}
        {{- range $dnsProto }}
        - protocol: {{ . }}
          port: {{ $p }}
        {{- end }}
        {{- end }}
    {{- if and .Values.dependencies.postgres.host .Values.networkPolicy.postgres.selector.enabled }}
    # Postgres egress — selector mode (in-cluster operator Postgres)
    # Migration reaches the same target as Gateway/Worker; the
    # peer never falls back to kube-system.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.postgres.selector.namespace }}
        - podSelector:
            matchLabels:
              {{- range $k, $v := .Values.networkPolicy.postgres.selector.matchLabels }}
              {{ $k }}: {{ $v }}
              {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.dependencies.postgres.port }}
    {{- end }}
    {{- if and .Values.dependencies.postgres.host .Values.networkPolicy.postgres.cidr.enabled }}
    # Postgres egress — CIDR mode (managed/external Postgres)
    - to:
        {{- range $c := .Values.networkPolicy.postgres.cidr.cidrs }}
        - ipBlock:
            cidr: {{ $c }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.postgres.cidr.port }}
    {{- end }}
{{- /* Source-of-truth marker for static label
   conformance. This verbatim line is what the
   migration-label test reads back out of the
   rendered manifest. */}}
{{- $migrationSelector := dict "app.kubernetes.io/component" "migration" -}}
{{- /* end migration-egress block */}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nexus.fullname" . }}-worker
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "nexus.name" . }}
      app.kubernetes.io/component: worker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- range $ns := .Values.networkPolicy.prometheus.namespaces }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns }}
      ports:
        - protocol: TCP
          port: {{ $metricsPort }}
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        {{- range $p := $dnsPort }}
        {{- range $dnsProto }}
        - protocol: {{ . }}
          port: {{ $p }}
        {{- end }}
        {{- end }}
    {{- if and .Values.dependencies.postgres.host .Values.networkPolicy.postgres.selector.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.postgres.selector.namespace }}
        - podSelector:
            matchLabels:
              {{- range $k, $v := .Values.networkPolicy.postgres.selector.matchLabels }}
              {{ $k }}: {{ $v }}
              {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.dependencies.postgres.port }}
    {{- end }}
    {{- if and .Values.dependencies.postgres.host .Values.networkPolicy.postgres.cidr.enabled }}
    - to:
        {{- range $c := .Values.networkPolicy.postgres.cidr.cidrs }}
        - ipBlock:
            cidr: {{ $c }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.postgres.cidr.port }}
    {{- end }}
{{- end }}
