apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexus.fullname" . }}-worker
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nexus.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      annotations:
        # Roll pods when config/secret content changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "nexus.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
        {{- with .Values.worker.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nexus.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: nexus-worker
          # Phase D-1 spec: image identical to the gateway side.
          # The helper guarantees the same image string is
          # rendered in both Deployments; the render test fails
          # on drift.
          image: {{ include "nexus.image" . | quote }}
          imagePullPolicy: {{ include "nexus.imagePullPolicy" . }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # The Worker pod exposes only the metrics port. The
          # OpenAI gateway and the console API are served only by
          # the Gateway Deployment; the Worker pod is internal
          # to the cluster and reachable only via ClusterIP.
          # Phase D-1 spec: "Worker는 트래픽을 받지 않으므로
          # Service를 만들지 마라. 다만 메트릭 수집과 헬스
          # 체크는 필요하다. 메트릭 포트만 노출하고 [delete] 메트릭
          # 보호를 적용하라." — the metrics port is the only
          # surface a worker pod exposes.
          ports:
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          # Phase D-1 role wiring. Setting
          # NEXUS_SCHEDULER_ROLE_ENABLED=true here plus omitting
          # the gateway listener on this Deployment isolates the
          # two roles onto distinct pods. Followers sleep on
          # WaitForLeadership; only the lease holder fires.
          env:
            - name: NEXUS_ROLE
              value: worker
            - name: NEXUS_SCHEDULER_ROLE_ENABLED
              value: "true"
            - name: NEXUS_POSTGRES_MAX_CONNS
              value: {{ .Values.worker.postgres.maxConns | quote }}
            {{- with .Values.worker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "nexus.fullname" . }}
            - secretRef:
                name: {{ include "nexus.secretName" . }}
          livenessProbe:
            {{- toYaml .Values.worker.livenessProbe | nindent 12 }}
          # Phase D-1: /readyz on the worker means "we hold the
          # Postgres lease" — it is intentionally NOT the data
          # plane listener. The probe points at the metrics
          # port because that is the only HTTP port a worker
          # pod exposes; the handler in main.go answers /readyz
          # based on whether the lease has been acquired yet.
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.metrics.port }}
            initialDelaySeconds: {{ .Values.worker.readinessProbe.initialDelaySeconds | default 15 }}
            periodSeconds: {{ .Values.worker.readinessProbe.periodSeconds | default 10 }}
            failureThreshold: {{ .Values.worker.readinessProbe.failureThreshold | default 6 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if and .Values.config.metabase .Values.config.metabase.seedDir (not .Values.config.metabase.seedFromExisting) }}
            - name: metabase-seed
              mountPath: {{ .Values.config.metabase.seedDir | default "/etc/nexus/metabase/seed" }}
              readOnly: true
            {{- end }}
          {{- with .Values.extraVolumeMounts }}
          {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if and .Values.config.metabase .Values.config.metabase.seedDir (not .Values.config.metabase.seedFromExisting) }}
        - name: metabase-seed
          configMap:
            name: {{ include "nexus.fullname" . }}-metabase-seed
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
      {{- toYaml . | nindent 8 }}
      {{- end }}
