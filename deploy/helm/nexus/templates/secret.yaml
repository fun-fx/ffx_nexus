{{- if not .Values.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nexus.fullname" . }}
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.geminiApiKey }}
  GEMINI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.masterKey }}
  NEXUS_MASTER_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.judgeApiKey }}
  NEXUS_JUDGE_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.embeddingsApiKey }}
  NEXUS_EMBEDDINGS_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.groqApiKey }}
  GROQ_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.mistralApiKey }}
  MISTRAL_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.gridApiKey }}
  GRID_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.adminEmail }}
  NEXUS_ADMIN_EMAIL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.adminPassword }}
  NEXUS_ADMIN_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- /* OIDC client secret for SSO; lives here because it's the most sensitive
       piece. Chart-managed K8s secrets are easier than templating it through
       an existingSecret in dev/test, but for prod set `existingSecret` and
       put this together with provider keys. */}}
  {{- with .Values.secrets.ssoClientSecret }}
  NEXUS_SSO_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- /* Invite email transport credentials. Empty values stay out of the
       rendered Secret so a fresh install without an enrolled email
       transport still produces a Secret containing only the keys the
       operator explicitly enabled. Exactly one of these is needed,
       matching config.email.provider. */}}
  {{- with .Values.secrets.resendApiKey }}
  NEXUS_RESEND_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.smtpPassword }}
  NEXUS_SMTP_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- if and .Values.dependencies.postgres.enabled .Values.dependencies.postgres.url }}
  NEXUS_POSTGRES_URL: {{ .Values.dependencies.postgres.url | quote }}
  {{- end }}
  {{- /* NEXUS_POSTGRES_MAX_CONNS — pod-level override for the
       pgxpool MaxConns ceiling. The Helm chart enforces a floor of
       minSafeMaxConns (default 8) and a ceiling of maxSafeMaxConns
       (default 64) — the floor is the c0.x #A-3 deadlock ceiling,
       the ceiling bounds the connection burn across replicaCount.
       A negative or unset value renders no env var; production
       then takes its built-in 8-floor from NewStore in
       internal/core/store.go. */}}
  {{- if and .Values.dependencies.postgres.enabled (gt (int .Values.dependencies.postgres.maxConns) 0) }}
  NEXUS_POSTGRES_MAX_CONNS: {{ .Values.dependencies.postgres.maxConns | quote }}
  {{- end }}
  {{- if and .Values.dependencies.clickhouse.enabled .Values.dependencies.clickhouse.url }}
  NEXUS_CLICKHOUSE_URL: {{ .Values.dependencies.clickhouse.url | quote }}
  {{- end }}
  {{- if and .Values.dependencies.redis.enabled .Values.dependencies.redis.url }}
  NEXUS_REDIS_URL: {{ .Values.dependencies.redis.url | quote }}
  {{- end }}
{{- end -}}
