# Default values for the Nexus Helm chart.
# Out of the box this deploys the gateway + console in zero-dependency mode
# (no Postgres/ClickHouse/Redis). Enable the dependency sections below to wire
# the control plane, trace persistence, rate limiting, and semantic cache.

replicaCount: 1

image:
  repository: ghcr.io/fun-fx/ffx_nexus
  # Defaults to .Chart.AppVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Ports the nexus binary listens on. These must match config.gatewayAddr /
# config.consoleAddr below (the chart keeps them in sync via the ConfigMap).
ports:
  gateway: 8080
  console: 8081

service:
  type: ClusterIP
  annotations: {}
  # Optional fixed cluster IP / loadBalancer settings can be added per-env.

# --- Non-secret configuration (rendered into a ConfigMap as NEXUS_* env) ---
# Only set what you need; empty values are omitted so the binary's own defaults
# apply. Secrets (provider keys, master key, DB DSNs) go under `secrets:` below.
config:
  gatewayAddr: ":8080"
  consoleAddr: ":8081"
  # Public HTTPS base for the OpenAI-compatible gateway (shown in console UI).
  publicGatewayUrl: ""
  # Optional Grafana URL to surface on the console's Spend / Quality /
  # Traces pages. Empty == the console hides the "Open in Grafana" link.
  # The bundled dashboard UIDs (nexus-01-overview, nexus-02-llm-spend,
  # nexus-03-eval-quality) must match the GrafanaDashboard CRs in
  # templates/grafana-dashboards.yaml.
  publicGrafanaUrl: ""
  # Operator-supplied allow-list of web origins the console may connect to.
  # Wired into CSP `connect-src` (was previously hardcoded to *.ffx.ai in
  # code). Empty list == CSP falls back to 'self' only.
  #
  # Example for our prod cluster (the marketing site + live-trace WSS
  # share the same hostname and are reachable via both https:// and
  # wss:// on it):
  #
  #   config:
  #     publicWebOrigins:
  #       - https://nexus.ffx.ai
  #       - https://api.ffx.ai
  #
  # Other deployments override this to their own marketing / SPA origins.
  publicWebOrigins: []        # []string
  upstreamTimeout: "120s"
  openaiBaseUrl: ""

  # BYOK / multi-tenancy: how upstream provider keys are resolved per request.
  # "shared" (default) uses org/env keys for everyone; "byok" prefers each
  # caller's own stored key (falling back to org -> env); "strict_byok" requires
  # a per-user key. byok modes need Postgres + secrets.masterKey.
  keyMode: "shared"

  # Public self-service signup at POST /api/auth/register (member role only).
  allowSignup: false

  # Quality-aware routing (Phase 4). Requires ClickHouse for live quality stats.
  routeGroups: ""
  routeWQuality: ""
  routeWCost: ""
  routeWLatency: ""
  routeWindow: ""
  routeRefresh: ""
  routeLoadBalance: false

  # Inline guardrails (hot-path policy checks; no datastore needed).
  guardrails:
    enabled: false
    blockPiiInput: false
    redactPiiOutput: false
    maxInputChars: 0
    denyPatterns: ""
    validateJsonOutput: false

  # Structured-output self-correction (requires guardrails.validateJsonOutput).
  selfCorrection:
    enabled: false
    maxRetries: 1

  # Local SLM judge for async evals (OpenAI-compatible inference server).
  judge:
    baseUrl: ""
    model: ""
    sampleRate: ""
    workers: ""

  # External Python eval sidecar (DeepEval/RAGAS).
  evalService:
    url: ""
    metrics: ""
    timeout: ""

  # When true, the runtime controller skips seeding the built-in
  # heuristic profiles (PII / Completeness) and the legacy
  # slm_judge / remote_eval defaults. Scoring comes exclusively
  # from external EvalPlugins. The flag is non-destructive: rows
  # already in the profile store are not deleted; admins remove
  # them through the console if needed.
  evalPluginOnly: false

  # Destructive companion to evalPluginOnly. When both are true
  # the runtime controller hard-deletes the well-known seed rows
  # (default-pii, default-completeness, default-judge,
  # default-remote) from the profile store on every boot. The
  # cluster converges on a plugin-only profile set without manual
  # console cleanup. Operators flipping this on must ensure an
  # external EvalPlugin covers PII detection or traces will go
  # unscored for personally identifiable information.
  purgeLegacyProfilesOnBoot: false

  # Semantic cache (requires Redis + an embeddings endpoint).
  semanticCache:
    enabled: false
    ttl: "24h"
    threshold: "0.92"
    maxEntries: 500
  embeddings:
    url: ""
    model: ""
    timeout: "5s"

  # --- Observability adapter toggle (V3) -----------------------------------
  # Each setting below independently opts nexus into one adapter; leaving
  # any of them off keeps the zero-dep fast path. The adapters are
  # independent: a ClickHouse outage doesn't disable the OTLP exporter, a
  # Prometheus scrape misconfig doesn't disable CH trace persistence.
  otlp:
    # master toggle. Endpoint must be a full OTLP/HTTP URL the binary
    # can POST to (e.g. http://otel-collector.observability.svc:4318/v1/traces
    # or https://api.honeycomb.io/v1/traces).
    enabled: false
    endpoint: ""
# NEXUS_METRICS_ADDR exposes a Prometheus /metrics endpoint on the
# gateway and console. Empty (default) means no scrape surface.
metricsAddr: ""

# Service-scoped metrics surface (V3 observability).
# Toggling this on:
#   1. sets `NEXUS_METRICS_ADDR=<host>:<port>` from `metrics.host:port` so
#      the binary binds a Prometheus text-format export on :<port>.
#   2. declares `<port name="metrics">` on the Deployment + Service so
#      Prometheus / VictoriaMetrics / vmagent can scrape at `Service:port`.
#   3. (optional, opt-in) creates a `ServiceMonitor` so the Prometheus
#      Operator picks it up automatically — only matters if your cluster
#      runs kube-prometheus-stack and you want operator-managed scrape
#      rules + alerting.
#
# The OTLP collector (`config.otlp.*` above) and Prometheus scrape
# (`metrics.*` here) are independent: a ClickHouse outage disables trace
# persistence but leaves /metrics up; a Prometheus scrape misconfig
# doesn't disable the OTLP path.
metrics:
  enabled: false
  host: ""
  port: 9101
  path: "/metrics"
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # Additional labels match the cluster's monitoring selector — e.g.
    # `release: kube-prometheus-stack` for kube-prometheus-stack's built-in
    # `Prometheus` CR's serviceMonitorSelector, or omit if using vmagent
    # with PodMonitor-style discovery.
    additionalLabels: {}
    relabelings: []
    metricRelabelings: []


  # --- V4 failover alert sinks --------------------------------------------
  # Both URLs are independently opt-in; empty means "no goroutine, no DNS".
  # The literal noop notifier (`internal/router/notifier.go`) is wired so
  # the gateway stays metric-only when these are blank. Set BOTH (or one)
  # in production so a primary going bad lights up the channel you actually
  # read on a Saturday morning.
  failoverWebhook: ""           # NEXUS_FAILOVER_WEBHOOK — generic JSON POST
  failoverSlack: ""             # NEXUS_FAILOVER_SLACK_WEBHOOK
  failoverAlertCooldown: 0s     # NEXUS_FAILOVER_ALERT_COOLDOWN; 0 = off

  # --- SSO (Keycloak or any standard OIDC IdP, V5+) -------------------------
  # Independent of any other knob. Empty issuer ⇒ SSOConfig.Enabled()=false
  # ⇒ /api/auth/sso/* routes are not registered, the UI hides the button.
  # Set issuer + clientId + redirectUrl here; put the client secret under
  # secrets.ssoClientSecret below. Keycloak example:
  #   issuer:      "https://keycloak.example/realms/cozy"
  #   clientId:    "nexus-console"
  #   redirectUrl: "https://console.example/api/auth/sso/callback"
  # The redirectUrl MUST be registered in your IdP as a valid redirect URI;
  # mismatches cause OIDC state-mismatch errors on /api/auth/sso/callback.
  sso:
    issuer: ""                  # NEXUS_SSO_ISSUER
    clientId: ""                # NEXUS_SSO_CLIENT_ID
    redirectUrl: ""             # NEXUS_SSO_REDIRECT_URL
    label: ""                   # NEXUS_SSO_LABEL  (defaults to "SSO" in code)

  # --- Metabase BI adapter (mirror of the V3 OTLP toggle) --------------------
  # Empty url means the adapter is fully off — NewMetabaseBootstrapper returns
  # nil, no goroutines, no DNS, no boot network calls. Set the URL to point at
  # a Metabase instance (the `metabase` service in deploy/docker-compose.yml's
  # `bi` profile fits; `http://metabase.observability.svc.cluster.local:3000`
  # works in cluster). The bootstrap is one-shot and idempotent — credentials
  # change by re-deploying Nexus, never a side-effect during request handling.
  metabase:
    url: ""                       # NEXUS_METABASE_URL
    user: ""                      # NEXUS_METABASE_USER
    password: ""                  # NEXUS_METABASE_PASSWORD
    clickhouseUrl: ""             # NEXUS_METABASE_CLICKHOUSE_URL (http://host:8123?database=...)
    postgresUrl: ""               # NEXUS_METABASE_POSTGRES_URL (postgres://...)
    seedDir: ""                   # NEXUS_METABASE_SEED_DIR (optional).
                                  # When non-empty AND seedFromExisting is false,
                                  # a ConfigMap "nexus-metabase-seed" is rendered
                                  # containing the 3 bundled reference JSONs
                                  # (01-overview, 02-llm-spend, 03-eval-quality)
                                  # and mount-bound into the pod. Defaults the
                                  # operator off (empty string) so unset
                                  # environments don't accidentally clobber a
                                  # Metabase instance with our dashboards.
    seedFromExisting: ""          # Optional: name of an existing ConfigMap to
                                  # mount at seedDir instead of rendering our
                                  # own. Useful when an operator wants to
                                  # preload dashboards owned by their team.
    extraSeeds: {}                # Map of  filename -> JSON body  for seeds to
                                  # add to the rendered ConfigMap alongside
                                  # the bundled three. The bootstrapper iterates
                                  # every *.json in the mounted dir, so each
                                  # entry here becomes another collection.
    healthTimeout: "90s"          # NEXUS_METABASE_HEALTH_TIMEOUT
    requestTimeout: "10s"         # NEXUS_METABASE_REQUEST_TIMEOUT

  # --- Grafana dashboard toggle (V5) -----------------------------------------
  # Renders three GrafanaDashboard CRs (01-overview, 02-llm-spend,
  # 03-eval-quality) into the chart-managed namespace so a Cozystack-managed
  # Grafana instance picks them up automatically. The toggle is independent
  # of the Grafana instance itself — Grafana is shared infra owned by the
  # platform/ops team (deploy/cozystack/09-grafana-dashboards.yaml applies
  # the equivalent manifests platform-side). This block just lets the
  # gateway author carry the dashboards in the chart so releases stay
  # source-of-truth in the same repo as the metrics they visualize.
  #
  # What it does on `enabled: true`:
  #   1. Renders the three bundled reference dashboard JSONs as ConfigMaps
  #      under names `nexus-dashboard-{overview,spend,eval}`.
  #   2. Renders three matching GrafanaDashboard CRs (kind from the
  #      `grafana.integreatly.org/v1beta1` API) that the Grafana operator
  #      reconciles into the target Grafana.
  #   3. Renders a GrafanaContactPoint + GrafanaAlertRuleGroup (in the
  #      same toggle) so alert routing is also chart-managed.
  grafana:
    enabled: false
    # `folder` is the display name in the Grafana UI. The operator will
    # assign a UID on first apply — `folderUID` below is only used by the
    # AlertRuleGroup, which can NOT auto-create its parent folder (the
    # existing folder UID must be discovered for a fresh cluster via
    # `curl -u admin:$PASS http://<grafana>/api/folders | jq`).
    folder: Nexus
    folderUID: ""                 # Required when alertsEnabled: true.
                                  # Empty => the chart renders dashboards but
                                  # omits the alert rule group.
    dashboardsEnabled: true       # Toggle for the 3 GrafanaDashboard CRs only.
    alertsEnabled: false          # Toggle for contact point + alert rules.
    # `extraDashboards` lets an operator preload additional JSON files
    # from the chart's `files/` dir (mounted at `extraDashboardsDir`).
    # Empty => ship only the 3 bundled references.
    extraDashboards: {}           # Map of filename -> JSON body.
    # Public URL surfaced on the console's *Spend* / *Quality* pages so the
    # operator can click through to the matching Grafana dashboard. Empty
    # => the console hides the link.
    publicUrl: ""
    # Label selector the Grafana CRs use to bind to a specific Grafana
    # instance. Cozystack's default operator labels grafana instances with
    # `dashboards: grafana`; override if your cluster uses something else
    # (e.g. `app.kubernetes.io/name: grafana` for vanilla grafana-operator).
    instanceSelector:
      matchLabels:
        dashboards: grafana

  # --- V5 high-concurrency tuning ---------------------------------------------
  # These map directly to the Go runtime env vars GOMEMLIMIT and GOGC. Set
  # `gomemlimit` to roughly `0.85 * container.limits.memory` to give the GC
  # an advisory target; otherwise Go's default behaviour is unbounded.
  # Leave empty to disable (zero-dep mode).
  runtime:
    gomemlimit: ""           # GOMEMLIMIT; e.g. 768MiB
    gogc: ""                 # GOGC; e.g. 100
  # NEXUS_MAX_CONCURRENT_PER_KEY caps in-flight requests per virtual key
  # on a single replica. 0 = disabled (RPM-only enforcement). Recommended
  # for production: 16–32 for shared pools, 4–8 for spotty model backends.
  maxConcurrentPerKey: 0

# --- Dependency wiring -------------------------------------------------------
# This chart does NOT deploy databases; it connects to external/managed ones
# (managed ClickHouse Cloud, an in-cluster Postgres/Redis operator, etc.).
# Set `enabled: true` and provide a connection URL. URLs contain credentials,
# so they are stored in the chart Secret (or your existingSecret).
dependencies:
  postgres:
    enabled: false
    url: "" # postgres://user:pass@host:5432/nexus?sslmode=require
  clickhouse:
    enabled: false
    url: "" # clickhouse://user:pass@host:9000/nexus
  redis:
    enabled: false
    url: "" # redis://:pass@host:6379/0

# --- Secrets -----------------------------------------------------------------
# Provide secret values here to have the chart create a Secret, OR set
# `existingSecret` to the name of a Secret you manage out-of-band (recommended
# for production). The existing Secret must use the same NEXUS_*/PROVIDER keys.
existingSecret: ""

secrets:
  openaiApiKey: ""
  anthropicApiKey: ""
  geminiApiKey: ""
  groqApiKey: ""
  mistralApiKey: ""
  gridApiKey: ""
  # 32-byte hex/base64 KEK for the encrypted credential store. Generate with
  # `openssl rand -hex 32` and PERSIST IT (needed to decrypt provider secrets).
  masterKey: ""
  judgeApiKey: ""
  embeddingsApiKey: ""
  # Bootstrap the first console admin (BYOK). Only used on first boot when the
  # org has no users yet; safe to leave set afterward. Provide both to enable.
  adminEmail: ""
  adminPassword: ""
  # OIDC client secret for SSO. Issuer/ClientID/RedirectURL live under config.sso;
  # only the secret stays here.
  ssoClientSecret: ""

# Escape hatch for arbitrary extra env (non-secret).
extraEnv: []
# - name: SOME_FLAG
#   value: "true"

# Mount extra env from existing ConfigMaps/Secrets.
#
# This is also how eval-plugin credentials reach Nexus. A plugin
# manifest's `spec.service.auth.secretRef` names a Secret and `keyRef`
# names the keys inside it; Nexus reads them from the environment, so the
# Secret has to be projected here. For
#   auth: { secretRef: langfuse-creds, keyRef: public_key|secret_key }
# either project the Secret directly (its keys arrive as PUBLIC_KEY and
# SECRET_KEY), or set NEXUS_PLUGIN_SECRET_LANGFUSE_CREDS_PUBLIC_KEY and
# NEXUS_PLUGIN_SECRET_LANGFUSE_CREDS_SECRET_KEY explicitly, which is the
# form to prefer once more than one plugin is installed because it
# cannot collide. See docs/eval-plugins.md.
envFrom: []
# - secretRef:
#     name: langfuse-creds

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

# The image already runs as non-root uid 65532; these harden the pod further.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

livenessProbe:
  httpGet:
    path: /healthz
    port: gateway
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz
    port: gateway
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

podAnnotations: {}
podLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Separate Tailscale Ingress for the console (:8081). Tailscale registers one
  # MagicDNS name per Ingress resource, so gateway and console need two Ingresses.
  console:
    enabled: false
    host: console
  # Route gateway (:8080). Defaults below are examples.
  hosts:
    - host: nexus.example.com
      paths:
        - path: /
          pathType: Prefix
          port: gateway
  tls: []
  # - secretName: nexus-tls
  #   hosts:
  #     - nexus.example.com

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: null

# PodDisruptionBudget for safer node drains (Talos rolling upgrades).
podDisruptionBudget:
  enabled: false
  minAvailable: 1
