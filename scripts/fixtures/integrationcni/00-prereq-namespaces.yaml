# Phase D-2b.21: namespaces fixture for the
# enforcing-CNI integration test cluster.
# Each namespace is the source/destination for
# the twelve scenarios. The podSpec fixtures
# themselves live in:
#   scripts/fixtures/integrationcni/01-test-pods.yaml
#   scripts/fixtures/integrationcni/02-stub-deps.yaml
#   scripts/fixtures/integrationcni/03-control-pod.yaml
#
# Sources live in their own namespaces so the
# rendered NetworkPolicy can match
# per-namespace (namespaceSelector).
#
# Dependency targets MUST NOT live in the release
# namespace (default). The chart renders a
# `<release>-default-deny` policy with an empty
# podSelector, which denies ingress to EVERY Pod
# in the release namespace; a stub parked there is
# unreachable no matter what the gateway's egress
# allowlist says, which silently converts an
# egress-allowlist assertion into a false RULE_GAP.
# Stateful deps therefore live in `database` (the
# namespace the chart's own
# networkPolicy.postgres.selector.namespace default
# names, i.e. the bundled Postgres operator's
# namespace) and the network-path deps live in
# cni-test-proxy. DNS lives in kube-system.
#
# cni-control namespace hosts the L2 (cluster DNS)
# probe; it is intentionally NOT selected by any
# rendered NetworkPolicy.
#
# Step B applies this file with `kubectl apply`
# (not dry-run), persisting every Namespace in
# the cluster before later steps validate
# namespaced fixtures. Steps D/F only do
# strict server dry-run on later fixture
# files, so any Namespace declared inside
# 03-control-pod.yaml or 04-control-service.yaml
# is NOT created — cni-control therefore is
# declared exactly once, here, and nowhere
# else.
---
apiVersion: v1
kind: Namespace
metadata:
  name: cni-test-ingress
  labels:
    kubernetes.io/metadata.name: cni-test-ingress
---
apiVersion: v1
kind: Namespace
metadata:
  name: cni-test-prometheus
  labels:
    kubernetes.io/metadata.name: cni-test-prometheus
---
apiVersion: v1
kind: Namespace
metadata:
  name: cni-test-untrusted
  labels:
    kubernetes.io/metadata.name: cni-test-untrusted
---
apiVersion: v1
kind: Namespace
metadata:
  name: database
  labels:
    kubernetes.io/metadata.name: database
---
apiVersion: v1
kind: Namespace
metadata:
  name: cni-test-proxy
  labels:
    kubernetes.io/metadata.name: cni-test-proxy
---
apiVersion: v1
kind: Namespace
metadata:
  name: cni-control
  labels:
    kubernetes.io/metadata.name: cni-control
    app.kubernetes.io/part-of: cni-control
