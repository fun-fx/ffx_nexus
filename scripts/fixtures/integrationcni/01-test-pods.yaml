apiVersion: v1
kind: Namespace
metadata:
  name: cni-test-ingress
  labels:
    app.kubernetes.io/name: nexus
    purpose: cni-test
---
apiVersion: v1
kind: Namespace
metadata:
  name: cni-test-prometheus
  labels:
    app.kubernetes.io/name: nexus
    purpose: cni-test
---
apiVersion: v1
kind: Namespace
metadata:
  name: cni-test-untrusted
  labels:
    app.kubernetes.io/name: nexus
    purpose: cni-test
---
apiVersion: v1
kind: Pod
metadata:
  name: cni-mock-ingress-controller
  namespace: cni-test-ingress
  labels:
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/component: ingress-controller
spec:
  containers:
  - name: httpecho
    image: cni-listener:local
    imagePullPolicy: Never
    args:
    - -ports=8080
    - -role=ingress
    - -target=cni-mock-ingress-controller
    ports:
    - containerPort: 8080
      name: http
      protocol: TCP
    readinessProbe:
      exec:
        command:
        - /cni-listener
        - -probe=8080
      initialDelaySeconds: 1
      periodSeconds: 3
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 65534
      capabilities:
        drop:
        - ALL
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
---
apiVersion: v1
kind: Pod
metadata:
  name: cni-mock-prometheus
  namespace: cni-test-prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: metrics
spec:
  containers:
  - name: scraper
    image: cni-listener:local
    imagePullPolicy: Never
    args:
    - -ports=9100
    - -role=prometheus
    - -target=cni-mock-prometheus
    ports:
    - containerPort: 9100
      name: metrics
      protocol: TCP
    readinessProbe:
      exec:
        command:
        - /cni-listener
        - -probe=9100
      initialDelaySeconds: 1
      periodSeconds: 3
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 65534
      capabilities:
        drop:
        - ALL
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
---
apiVersion: v1
kind: Pod
metadata:
  name: cni-untrusted-default
  namespace: cni-test-untrusted
  labels:
