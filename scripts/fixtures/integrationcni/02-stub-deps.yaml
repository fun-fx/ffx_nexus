apiVersion: v1
kind: Service
metadata:
  name: cni-gateway
  labels:
    app.kubernetes.io/part-of: nexus
    app.kubernetes.io/name: nexus-cni-test-nexus
    app.kubernetes.io/instance: nexus-cni-test-nexus
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: gateway
  namespace: default
spec:
  selector:
    app.kubernetes.io/component: gateway
    app.kubernetes.io/instance: nexus-cni-test
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: gateway
  - port: 9101
    targetPort: 9101
    protocol: TCP
    name: metrics
---
