apiVersion: v1
kind: Pod
metadata:
  name: cni-mock-egress-proxy
  namespace: default
  labels:
    app.kubernetes.io/name: proxy
    app.kubernetes.io/component: egress-proxy
spec:
  containers:
  - name: proxy
    image: cni-listener:local
    imagePullPolicy: Never
    args:
    - -ports=3128
    - -role=egress-proxy
    - -target=cni-mock-egress-proxy
    ports:
    - containerPort: 3128
      name: proxy
      protocol: TCP
    readinessProbe:
      exec:
        command:
        - /cni-listener
        - -probe=3128
      initialDelaySeconds: 1
      periodSeconds: 3
---
