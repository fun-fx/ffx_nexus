# Phase D-2b.21 control Pod. This Pod is
# placed in a namespace NOT selected by any
# rendered NetworkPolicy. It is used to
# confirm that cluster DNS + Service routing +
# cilium datapath are working without policy
# effects, separating "policy denied" from
# "cluster plumbing broken" when ALLOW/DENY
# verdicts are inconclusive. The label-set is
# deliberately identical to a fixture role so
# the kubelet/cilium lifecycle is the same.
#
# Namespace/cni-control is declared exactly
# once in 00-prereq-namespaces.yaml and is
# persisted via Step C's `kubectl apply`,
# before this file is processed by Step D's
# `kubectl apply --dry-run=server --validate=strict`
# (dry-run does not persist Namespaces, so a
# declaration here would NOT satisfy the
# later dry-runs).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cni-control-probe
  namespace: cni-control
  labels:
    app: cni-control
    role: probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cni-control
      role: probe
  template:
    metadata:
      labels:
        app: cni-control
        role: probe
    spec:
      nodeName: nexus-cni-test-worker2
      # Phase D-2b.29 hardened fixture contract.
      # cni-listener only binds non-privileged
      # ports (>1024) and reads /proc/net for
      # nothing; runAsUser/Group 65534 (nobody) +
      # readOnlyRootFilesystem + drop ALL
      # capabilities is sufficient. Any future
      # code that requires root MUST be caught
      # by fixture_semantic_admission.py before
      # it's applied.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: cni-listener:local
          imagePullPolicy: Never
          command: ["/cni-listener"]
          args: ["-ports=8080", "-role=control", "-target=cni-control-probe"]
          ports:
            - containerPort: 8080
              name: control
              protocol: TCP
          readinessProbe:
            exec:
              command: ["/cni-listener", "-probe=8080"]
            initialDelaySeconds: 1
            periodSeconds: 3
          env:
            - name: POD_NAME
              value: cni-control-probe
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
