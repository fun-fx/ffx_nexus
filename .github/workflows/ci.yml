# Fast checks on every push and pull request.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: toolchain version
        # When go.mod has a `toolchain` directive (Go 1.21+), go picks
        # that exact patch release automatically. Logging which one it
        # uses makes govulncheck's stdlib version matches self-evident
        # in the run log without us having to read scanner output.
        run: |
          go version
          # go env GOTOOLCHAIN shows 'auto' vs 'local'; the toolchain
          # directive is consumed regardless thanks to setup-go@v6.
          go env GOTOOLCHAIN GOVERSION

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: go build
        run: |
          go build -o bin/nexus ./cmd/nexus
          go build -o bin/nexus-evalbatch ./cmd/nexus-evalbatch

      - name: govulncheck
        # Surfaces known CVEs in our Go dep graph. Slow on cold cache but
        # cheap to cache after the first run; -show=verbose keeps the
        # output reproducible in the run log. Allow if no Go modules require
        # the binary — Go 1.26 doesn't ship govulncheck by default.
        run: |
          if ! command -v govulncheck >/dev/null 2>&1; then
            go install golang.org/x/vuln/cmd/govulncheck@latest
          fi
          govulncheck ./...

  eval-regression:
    name: Eval regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: build nexus-evalbatch
        run: go build -o bin/nexus-evalbatch ./cmd/nexus-evalbatch

      - name: regression gate (hermetic, heuristic evaluator)
        # Runs the committed dataset through the LLM-free heuristic evaluator and
        # fails the build if any metric's mean score regresses beyond tolerance
        # versus the committed baseline. Fully deterministic — no provider keys
        # or eval service required.
        run: |
          ./bin/nexus-evalbatch \
            -dataset datasets/regression_example.jsonl \
            -evaluator heuristic \
            -baseline datasets/regression_baseline.json \
            -tolerance 0.05

  eval-service:
    name: Eval service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eval-service
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: eval-service/requirements-test.txt

      - name: Install test deps
        run: pip install -r requirements-test.txt

      - name: pytest
        run: python -m pytest -q

  web:
    name: Web dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci

      - name: npm build
        run: npm run build

      - name: npm audit
        # Production deps only. We don't gate on dev-dep CVEs that are
        # postcss / esbuild / vite-type audits because the production
        # bundle never embeds those; dev-deps come back in CI's parallel
        # build target. High+ severity in production deps blocks merge;
        # moderate / low are logged but the workflow still passes so we
        # can move react-router bumps into their own PRs.
        run: |
          set -e
          npm audit --omit=dev --audit-level=high
          # Always show full dep-graph state at end for the run log.
          npm audit --json | tee npm-audit.json || true
