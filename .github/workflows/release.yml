# Publish a release on version tags: a container image, cross-platform
# binaries, and the npm wrapper that downloads them.
# Usage: git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    name: Binaries and GitHub Release
    runs-on: ubuntu-latest
    permissions:
      # goreleaser creates the Release and uploads the archives the npm
      # wrapper and the curl installer fetch.
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The console SPA is embedded into the binary at compile time
      # (web/embed.go). The .goreleaser.yaml before-hooks build it; this step
      # only provides the toolchain and the npm cache.
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm:
    name: npm wrapper
    runs-on: ubuntu-latest
    # The wrapper downloads its binary from the Release at run time, so
    # publishing it before the archives exist would ship a version that 404s
    # for anyone quick enough to install it.
    needs: binaries
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org

      # The package version is the tag, and the wrapper reads its own version
      # to build the download URL — so this is what points it at the Release
      # that was just published. --no-git-tag-version because the tag exists.
      - name: set version from tag
        working-directory: npx
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: publish
        working-directory: npx
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
