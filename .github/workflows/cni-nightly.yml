# =============================================================================
# d2b.34 — Default-branch workflow_dispatch registration bootstrap.
#
# GitHub Actions documents that a workflow exposing `workflow_dispatch`
# inputs is dispatchable from any registered ref, BUT the repository's
# workflow registry builds its surface from the workflow file as it
# appears on the DEFAULT BRANCH (main). When a workflow path exists
# only on a feature branch, the registry does not advertise workflow
# dispatch surface for any ref, including the feature branch itself,
# and `gh workflow run` returns HTTP 422 with diagnostic
# "Workflow does not have 'workflow_dispatch' trigger".
#
# Reference:
#   https://docs.github.com/en/actions/how-tos/manage-workflow-runs/
#     manually-run-a-workflow
#   "To trigger the workflow_dispatch event, your workflow must be in
#    the default branch."
#
# Goal of this bootstrap:
#   - Place a workflow file at the EXACT same path the full cni-policy-gate
#     workflow uses (`.github/workflows/cni-nightly.yml`) so the registry
#     advertises the trigger on the default branch.
#   - Expose the SAME `workflow_dispatch` input schema
#     (`recovery_pr_sha`, `run_index`) as the full enforcement workflow,
#     so a future `gh workflow run --ref fix/d2b-cni-clean-tree-artifact
#     -f recovery_pr_sha=<sha> -f run_index=1-of-3` will dispatch the
#     run on the candidate branch and not this bootstrap.
#   - REFUSE to actually execute CNI enforcement from default branch.
#     The only job in this workflow is an explicit guard job:
#       - If `github.ref_name == main` OR attempted to run enforcement
#         steps, FAIL with non-zero exit.
#       - The guard prints the dispatch inputs to the log so the
#         operator can confirm values without leaking any secrets
#         (none are present) and exits cleanly with code 1.
#       - No kind / kubectl / Helm / Cilium / Docker / chart /
#         scenario / artifact-upload / secret-checkout steps.
#
# Reasons main MUST refrain from enforcement:
#   1. Heavy CNI gating trains on a pinned recovery SHA against a
#      specific chart/fixture/security contract; the operator must
#      select the candidate branch (`fix/d2b-cni-clean-tree-artifact`
#      or similar) and the candidate's pinned SHA via the input.
#   2. main's networkPolicy.enforcementAcknowledged default is
#      intentionally false and the chart fail-closed guard rejects
#      `enforcementAcknowledged != true` to make heavy runs safe.
#      Running enforcement on main without coordination would
#      hide the failure of the contract.
#   3. Heavy runs require cluster credentials and are NOT held
#      by default-branch workflows.
#
# This file replaces the absence of any YAML at the
# `.github/workflows/cni-nightly.yml` path on `main`. Adding a
# workflow with `workflow_dispatch` here does not change the
# enforced workflow's identity (workflow id 338819595, name
# `cni-policy-gate`) — GitHub's registry treats the path as the
# primary identifier; the dispatch surface is then available for
# both this bootstrap AND for the candidate branch's full workflow.
#
# Concurrency:
#   - We restrict in-flight runs of THIS bootstrap to a single
#     in-flight run to prevent a misclick on the Run Workflow button
#     from queueing N identical bootstrap runs. We do NOT include the
#     candidate enforcement workflow's concurrency group; that
#     candidate workflow must keep its own concurrency policy
#     unchanged.
#
# Permissions:
#   - contents: read only. No `packages: write`, no `id-token: write`,
#     no workflow mutation. The guard job only resolves
#     `github.event`/`github.ref` from event metadata.
# =============================================================================

name: cni-policy-gate

on:
  workflow_dispatch:
    inputs:
      recovery_pr_sha:
        description: "Recovery PR SHA pinned by the chart agent. CNI run is only valid for this SHA."
        required: true
        type: string
      run_index:
        description: "Run index 1-of-3, 2-of-3, 3-of-3. Recorded into the artifact name."
        required: true
        type: string

# ------------------------------------------------------------------
# d2b.34 — concurrency limited to bootstrap runs only. We deliberately
# do NOT cancel in-flight candidate enforcement runs.
# ------------------------------------------------------------------
concurrency:
  group: cni-policy-gate-bootstrap-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  default-branch-guard:
    name: default-branch dispatch registration guard
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: refuse to enforce from default branch
        env:
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          INPUT_RECOVERY_PR_SHA: ${{ inputs.recovery_pr_sha }}
          INPUT_RUN_INDEX: ${{ inputs.run_index }}
        run: |
          set -euo pipefail
          echo "============================================================"
          echo "d2b.34 — cni-policy-gate default-branch dispatch bootstrap"
          echo "============================================================"
          echo "REF_NAME:           ${REF_NAME}"
          echo "REF:                ${REF}"
          echo "input recovery_pr_sha: ${INPUT_RECOVERY_PR_SHA}"
          echo "input run_index:        ${INPUT_RUN_INDEX}"
          echo
          if [[ "${REF_NAME}" == "main" ]]; then
            echo "FAIL: dispatch registration bootstrap must not run CNI enforcement on main;" >&2
            echo "      select an approved candidate branch and its pinned recovery SHA." >&2
            echo "HINT: gh workflow run cni-nightly.yml \\" >&2
            echo "        --ref fix/d2b-cni-clean-tree-artifact \\" >&2
            echo "        -f recovery_pr_sha=<pinned-sha> \\" >&2
            echo "        -f run_index=1-of-3" >&2
            echo "This run is intentionally a non-enforcement guard exit." >&2
            exit 1
          fi
          echo
          echo "OK on non-default ref. The full enforcement workflow is registered"
          echo "   under the same path (.github/workflows/cni-nightly.yml) on the"
          echo "   candidate branch; dispatching from this bootstrap is no longer"
          echo "   required because the registry now advertises workflow_dispatch"
          echo "   on the candidate branch as well."
          echo
          echo "If you reached this step from the candidate branch, this guard"
          echo "   pass-through print is informational only; the candidate branch's"
          echo "   full workflow is what executes CNI scenarios."
          echo
          # Print the input values so the operator can confirm correlation
          # between dispatch intent and the recorded artifact name.
          echo "recorded recovery_pr_sha=${INPUT_RECOVERY_PR_SHA}"
          echo "recorded run_index=${INPUT_RUN_INDEX}"
          echo "recorded event_name=${{ github.event_name }}"
          echo "recorded ref=${REF}"
          echo
          echo "NOTE: This bootstrap does NOT execute:"
          echo "  - kind cluster up/down"
          echo "  - kubectl / Cilium install"
          echo "  - Helm install / chart rendering"
          echo "  - NetworkPolicy apply"
          echo "  - CNI scenario scripts"
          echo "  - cni-listener image build / Trivy"
          echo "  - any artifact upload"
          echo "  - any secret / cluster credential access"
          echo
          echo "If you expected this run to perform heavy CNI enforcement, you"
          echo "   dispatched the wrong workflow or the wrong ref. Re-dispatch:"
          echo "   gh workflow run cni-nightly.yml \\"
          echo "     --ref fix/d2b-cni-clean-tree-artifact \\"
          echo "     -f recovery_pr_sha=<pinned-sha> \\"
          echo "     -f run_index=1-of-3"
          exit 0
