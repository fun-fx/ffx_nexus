# D-2b NetworkPolicy CI gate.
#
# Three jobs, separated by role, so GitHub
# branch protection sees deterministic state
# on every PR:
#
#   cni-lightweight-gate
#     - always runs when this workflow fires
#       (even on PRs with no policy changes)
#     - renders the chart with the canonical
#       enterprise profile
#     - asserts render yields 4 NetworkPolicy
#       kinds with the expected role labels
#     - emits ALWAYS a pass/fail conclusion
#     - cheap (>30s). Acts as the merge
#       requirement when no policy file
#       changed.
#
#   cni-policy-required
#     - path-filtered to policy files
#     - runs the full enforcing-CNI integration
#       gate (all declared scenarios + mutations +
#       upgrade rehearsal)
#     - heavy (~20-30 minutes)
#     - this is the additional merge
#       requirement that fires on policy change
#
#   cni-policy-gate-logs (artifact upload)
#     - every policy-required run uploads
#       artifacts/ named with
#       cni-${GITHUB_RUN_ID}-${GITHUB_SHA::7}
#       so a failure can be diffed across runs.
#
# The lightweight gate is what every PR waits
# for. The heavy gate only fires on policy
# changes. NO smoke-and-trick: every gate state
# is explicit and grep-able.
#
# Concurrency:
#   group = cni-gate-${{ github.event.pull_request.head.ref || github.ref }}
#   cancel-in-progress = true
#   so a re-push on the same PR cancels the
#   prior run; only the latest commit's result
#   becomes the merge gate.
#
# No retries. A failed run is a failed run.
# A flake is recorded exactly once; rerunning
# the gate is a new workflow_run record.

name: cni-policy-gate

on:
  schedule:
    - cron: "0 2 * * *"
  pull_request:
    paths:
      - "deploy/helm/nexus/templates/networkpolicy.yaml"
      - "deploy/helm/nexus/templates/serviceaccount-worker.yaml"
      - "deploy/helm/nexus/templates/deployment.yaml"
      - "deploy/helm/nexus/templates/deployment-worker.yaml"
      - "deploy/helm/nexus/templates/pre-install-validation.yaml"
      - "deploy/helm/nexus/templates/servicemonitor.yaml"
      - "deploy/helm/nexus/templates/networkpolicy.yaml"
      - "deploy/helm/nexus/templates/migration-job.yaml"
      - "deploy/helm/nexus/values.yaml"
      - "deploy/helm/nexus/values.schema.json"
      - "deploy/helm/nexus/tests/render_test.py"
      - "deploy/helm/nexus/tests/mutation_test.py"
      - "internal/netpolicy/**"
      - "internal/urlpolicy/**"
      - "internal/depinventory/**"
      - "internal/contracttest/integrationcni/**"
      - "internal/contracttest/d2b_*_test.go"
      - "internal/config/**"
      - "docs/network-allowlist.md"
      - "docs/dependency-contract.md"
      - "docs/d2b-egress-proxy-contract.md"
      - "docs/cni-comparison.md"
      - "docs/cni-environment-changes.md"
      - "docs/phase-d2b-*"
      - "scripts/test-cluster-up.sh"
      - "scripts/test-cluster-down.sh"
      - "scripts/install-nexus-test.sh"
      - "scripts/test-upgrade-rehearsal.sh"
      - "scripts/test-upgrade-rehearsal-up.sh"
      - "scripts/d2b-twelve-scenarios.sh"
      - "scripts/d2b-failure-reproduction.py"
      - "scripts/fixtures/integrationcni/**"
      - "scripts/wait-cilium-endpoints.sh"
      - "Makefile"
      - ".github/workflows/cni-nightly.yml"
      - "go.mod"
  # Phase D-2b.34 (reindex) — narrow push trigger limited to main branch
  # AND the workflow file path only. Forces GitHub Actions to re-evaluate
  # the workflow definition on every push that touches THIS exact file
  # on main, so the dispatch registry can re-promote the
  # `workflow_dispatch` trigger schema after a merge that replaced the
  # file on the default branch. Any broader scope (chart, application,
  # docs, fixtures) is explicitly avoided. The heavy enforcement job
  # remains gated by `if: github.event_name == 'workflow_dispatch'`
  # so this push run cannot run heavy enforcement regardless of inputs.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cni-nightly.yml"
  # The heavy enforcement gate is run ONLY when a
  # human invokes it. The input `recovery_pr_sha`
  # is the SHA pinned in the chart's branch — the
  # CNI run is valid ONLY for that SHA. The agent /
  # operator opens this workflow dispatch three
  # times against the SAME SHA. Three separate
  # runs are required before the merge gate flips
  # to green.
  workflow_dispatch:
    inputs:
      recovery_pr_sha:
        description: "Recovery PR SHA pinned by the chart agent. CNI run is only valid for this SHA."
        required: true
        type: string
      run_index:
        description: "Run index 1-of-3, 2-of-3, 3-of-3. Recorded into the artifact name."
        required: true
        type: string

# Concurrency: ONLY the lightweight gate cancels
# in-flight runs per branch. The enforcement gate
# records three independent runs as separate
# artifacts; we must NOT collapse them.
concurrency:
  group: cni-lightweight-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

# Permissions: read-only. Anything that needs
# write is a token escalation we should NOT
# silently grant to CNI runs.
permissions:
  contents: read

jobs:
  # ====================================================================
  # LIGHTWEIGHT GATE — runs on every PR.
  # Renders the chart with the canonical
  # enterprise-profile values. Asserts:
  #   - helm template succeeds
  #   - 4 NetworkPolicy documents are emitted
  #     (default-deny ingress + egress,
  #      gateway, worker, migration)
  #   - each policy's podSelector matches the
  #     documented role label contract.
  # RAPID: ~30s on a fast runner.
  # This job ALWAYS produces a conclusion
  # (success or failure); branch protection's
  # required check has unambiguous status.
  # ====================================================================
  cni-lightweight-gate:
    name: CNI lightweight gate (always)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: helm render + NetworkPolicy shape check
        run: |
          set -euo pipefail
          helm version --short
          # Render with enterprise enforcement.
          helm template render-test deploy/helm/nexus \
            --set networkPolicy.mode=enforce \
            --set networkPolicy.profile=enterprise \
            --set networkPolicy.enforcementAcknowledged=true \
            --set networkPolicy.egress.proxy.enabled=true \
            --set networkPolicy.egress.proxy.host=p.example.svc.cluster.local \
            --set networkPolicy.egress.proxy.port=3128 \
            --set networkPolicy.egress.proxy.namespace=p \
            > /tmp/render.out
          # Count NetworkPolicy documents.
          count=$(grep -c '^kind: NetworkPolicy$' /tmp/render.out)
          echo "NetworkPolicy docs: $count"
          if [[ "$count" -lt 4 ]]; then
            echo "FAIL: expected at least 4 NetworkPolicy docs (default-deny ingress, default-deny egress, gateway, worker, migration)."
            exit 1
          fi
          # Role selectors must be present.
          for role in gateway worker migration; do
            if ! grep -A2 "app.kubernetes.io/component: ${role}" /tmp/render.out | grep -q 'podSelector'; then
              echo "FAIL: podSelector for role=$role not found in rendered policies."
              exit 1
            fi
          done
          echo "OK"
      - name: Upload lightweight render artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cni-lightweight-render-${{ github.run_id }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/render.out
          if-no-files-found: ignore

  # ====================================================================
  # ENFORCEMENT GATE — Pin the CNI run to a
  # specific recovery PR SHA. We do NOT use the
  # default `actions/checkout@v4` ref, because
  # the action reflows to whatever the run's
  # caller (schedule / PR / dispatch) implied.
  # Instead we checkout the SHA from
  # `github.event.inputs.recovery_pr_sha` so
  # the chart code matches the SHA recorded in
  # the merge report. If the input is empty
  # (e.g. dispatched by `schedule`), the run
  # refuses with an explicit error.
  #
  # Runs 3× independently on the SAME SHA. The
  # chart agent bundles the three workflow runs
  # URLs into the PR description as the merge
  # gate evidence.
  # ====================================================================
  cni-enforcement-gate:
    name: CNI enforcement gate (3× runs on pinned SHA)
    # workflow_dispatch is the only trigger for
    # the heavy gate: schedule + PR paths can
    # never produce enough evidence (PRs change
    # between runs; schedule runs against refs
    # we cannot pin).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    # Phase D-2b.34 — entire heavy-job evidence
    # root is routed outside the worktree. The
    # job cannot declare ARTIFACTS at this
    # scope because ${{ runner.temp }} is not
    # available at job env (actionlint). Instead
    # we route it through $GITHUB_ENV via the
    # dedicated init step below — ${ARTIFACTS}
    # is then a single source of truth for every
    # subsequent step (Step A, pinned-versions,
    # cluster-up, install, scenarios, rehearsal,
    # teardown, upload-artifact).
    steps:
      - name: Validate SHA input
        run: |
          set -euo pipefail
          if [[ -z "${{ github.event.inputs.recovery_pr_sha }}" ]]; then
            echo "FAIL: workflow_dispatch must supply recovery_pr_sha"
            exit 1
          fi
          if [[ -z "${{ github.event.inputs.run_index }}" ]]; then
            echo "FAIL: workflow_dispatch must supply run_index (1-of-3, 2-of-3, 3-of-3)"
            exit 1
          fi
          echo "Pinned SHA: ${{ github.event.inputs.recovery_pr_sha }}"
          echo "Run index:  ${{ github.event.inputs.run_index }}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.recovery_pr_sha }}
          fetch-depth: 0

      - name: "Initialize external artifact root (d2b.35: physical boundary + I/O classification)"
        # d2b.35 — the init step classifies every artifact
        # I/O fault as a fail_artifact_io-emitted exit 11.
        # The contract sequence is:
        #   1. RUNNER_TEMP, GITHUB_WORKSPACE, GITHUB_ENV
        #      are all required (no silent /tmp fallback).
        #   2. The raw candidate path
        #      ${RUNNER_TEMP}/d2b-cni-${github.run_id}
        #      and ${GITHUB_WORKSPACE} are canonicalised
        #      with realpath -m (lexical) BEFORE any mkdir
        #      — a path that looks outside-but-resolves-
        #      inside-via-symlink is rejected here.
        #   3. mkdir -p creates the canonical external
        #      root; any failure exits 11 (the previous
        #      set -e-only path exited 1 from mkdir, which
        #      mixed I/O faults with subshell crashes).
        #   4. The created root is re-canonicalised with
        #      realpath -e (physical) and the boundary
        #      test is re-applied. This closes a
        #      pre-existing symlink / traversal ambiguity.
        #   5. The path is verified to be a real directory.
        #   6. ARTIFACTS=<realpath> is appended to
        #      $GITHUB_ENV (single source of truth for
        #      every downstream step).
        # ${{ runner.temp }} is available at step-level but
        # NOT at job-level, so this is the canonical
        # propagation pattern. use eval is forbidden and
        # bare mkdir is wrapped in fail_artifact_io.
        run: |
          set -euo pipefail
          fail_artifact_io() {
            echo "FAIL: $*" >&2
            exit 11
          }

          # (1) every required variable must be set
          [[ -n "${RUNNER_TEMP:-}"    ]] || fail_artifact_io "RUNNER_TEMP is unset/empty; outside-tree artifact root requires it (no /tmp fallback)"
          [[ -n "${GITHUB_WORKSPACE:-}" ]] || fail_artifact_io "GITHUB_WORKSPACE is unset/empty; cannot establish physical boundary"
          [[ -n "${GITHUB_ENV:-}"      ]] || fail_artifact_io "GITHUB_ENV is unset/empty; cannot publish ARTIFACTS"

          # (2) lexical canonicalisation of both paths
          RAW_ARTIFACTS="${RUNNER_TEMP}/d2b-cni-${{ github.run_id }}"
          ARTIFACTS_REAL="$(realpath -m -- "${RAW_ARTIFACTS}")" || fail_artifact_io "cannot canonicalize artifact root candidate (${RAW_ARTIFACTS})"
          WORKSPACE_REAL_LEX="$(realpath -m -- "${GITHUB_WORKSPACE}")" || fail_artifact_io "cannot canonicalize workspace (${GITHUB_WORKSPACE})"
          case "${ARTIFACTS_REAL}" in
            "${WORKSPACE_REAL_LEX}"|"${WORKSPACE_REAL_LEX}"/*)
              fail_artifact_io "artifact root resolves inside worktree (lexical: ${ARTIFACTS_REAL} under ${WORKSPACE_REAL_LEX})" ;;
          esac

          # (3) mkdir with explicit classification
          mkdir -p -- "${ARTIFACTS_REAL}" 2>/dev/null || fail_artifact_io "cannot create external artifact root (${ARTIFACTS_REAL})"

          # (4) physical canonicalisation (post-create realpath -e)
          ARTIFACTS_REAL="$(realpath -e -- "${ARTIFACTS_REAL}")" || fail_artifact_io "cannot physical-resolve created artifact root"
          WORKSPACE_REAL="$(realpath -e -- "${GITHUB_WORKSPACE}")" || fail_artifact_io "cannot physical-resolve workspace (${GITHUB_WORKSPACE})"
          case "${ARTIFACTS_REAL}" in
            "${WORKSPACE_REAL}"|"${WORKSPACE_REAL}"/*)
              fail_artifact_io "artifact root resolves inside worktree (physical: ${ARTIFACTS_REAL} under ${WORKSPACE_REAL})" ;;
          esac

          # (5) directory verification
          [[ -d "${ARTIFACTS_REAL}" ]] || fail_artifact_io "artifact root is not a directory (${ARTIFACTS_REAL})"

          # (6) publish to $GITHUB_ENV
          printf 'ARTIFACTS=%s\n' "${ARTIFACTS_REAL}" >> "${GITHUB_ENV}" 2>/dev/null \
            || fail_artifact_io "cannot publish ARTIFACTS to GITHUB_ENV (${GITHUB_ENV})"

          echo "OK: external artifact root published: ${ARTIFACTS_REAL}"

      - name: Verify checked-out SHA matches
        run: |
          set -euo pipefail
          cur_sha=$(git rev-parse HEAD)
          want_sha="${{ github.event.inputs.recovery_pr_sha }}"
          echo "actual=$cur_sha"
          echo "want  =$want_sha"
          if [[ "$cur_sha" != "$want_sha" ]]; then
            echo "FAIL: checkout SHA did not pin to the dispatch input"
            exit 1
          fi

      # ----------------------------------------------------------------
      # Phase D-2b.34 — Step A external-artifact-root contract
      # (single source of truth).
      #
      # The Step A artifact capture path IS the upload-artifact
      # source: every heavy substep of this job reads/writes
      # ${ARTIFACTS}, which is initialized by the dedicated
      # `Initialize external artifact root` step above and
      # published via $GITHUB_ENV. There is no separate
      # "outside-tree capture + worktree copy" path: the
      # capture lands in ${ARTIFACTS}/checkout-identity.txt
      # directly, the clean-tree assertion runs raw
      # `git status --porcelain` against the worktree, the
      # boundary check prevents ARTIFACTS from ever
      # resolving under ${GITHUB_WORKSPACE}, and upload
      # harvests the same env-driven path. Run 32934127483
      # proved the prior shape wrote 13 gate-emitted files
      # into ${GITHUB_WORKSPACE}/artifacts/integrationcni
      # and a downstream raw porcelain correctly
      # fail-closed them — d2b.34 makes that impossible.
      #
      # Contract rationale:
      #   (a) ARTIFACTS must be set, propagating from the
      #       init step. unset ⇒ fail_artifact_io (exit 11)
      #   (b) The external capture directory must be
      #       creatable; mkdir-vs-file conflict ⇒ exit 11.
      #   (c) Identity capture write itself must succeed;
      #       file-vs-directory conflict ⇒ exit 11.
      #   (d) The capture IS the upload source. There is no
      #       post-pass copy of the identity into the
      #       worktree; the clean-tree assertion runs
      #       before any worktree write, and the boundary
      #       check above prevents the worktree from being
      #       a valid capture root.
      #   (e) Source-clean judgement is raw and
      #       unfiltered — no `.gitignore` rule is added,
      #       no path filter is applied to the porcelain
      #       output, no `.git/info/exclude` is consulted.
      #       Genuine tracked/untracked source dirt still
      #       triggers exit 10.
      #
      # The canonical deterministic regression suite at
      # scripts/test_clean_tree_artifact_routing.sh
      # enforces these invariants against a fake external
      # capture root (no Docker / Kind / Cilium / network).
      # The historical compatibility alias
      # scripts/test_clean_tree_artifact_regression.sh
      # is now a thin wrapper that delegates to the
      # canonical suite so existing runbooks still find
      # the canonical contract under the historical name.
      # ----------------------------------------------------------------
      - name: "Step A — checkout identity + clean tree assertion (d2b.34: write-through external artifact root)"
        run: |
          set -euo pipefail

          # ---- fail-closed helper for artifact I/O ----
          # Every Step-A artifact I/O fault surfaces as exit 11 with a
          # diagnosable message. We deliberately do NOT use `set -e` alone
          # because that collapses multiple fault shapes (boundary check
          # vs mkdir vs write) into the same exit code; an auditor
          # should be able to tell what failed without parsing log lines.
          fail_artifact_io() {
            echo "FAIL: $*" >&2
            exit 11
          }

          # (1) ARTIFACTS must be set, sourced from the
          #     init step's $GITHUB_ENV propagation. No
          #     silent fallback.
          if [[ -z "${ARTIFACTS:-}" ]]; then
            fail_artifact_io "ARTIFACTS is unset/empty; initialize step did not propagate (no /tmp fallback)"
          fi

          # (1a) ARTIFACTS must not resolve under
          #      GITHUB_WORKSPACE — physical boundary
          #      check (d2b.35). The init step already
          #      performed this test once; we repeat
          #      here so an operator-mis-deployed env
          #      override (a future caller) cannot
          #      re-route the capture into the worktree
          #      via a symlink whose lexical form looks
          #      external. Both realpath -m (lexical) and
          #      realpath -e (physical, post-redirect)
          #      paths are checked.
          [[ -n "${GITHUB_WORKSPACE:-}" ]] || fail_artifact_io "GITHUB_WORKSPACE is unset/empty; cannot establish physical boundary"
          ARTIFACTS_LEX="$(realpath -m -- "${ARTIFACTS}")" || fail_artifact_io "cannot lexical-canonicalize ARTIFACTS (${ARTIFACTS})"
          WORKSPACE_LEX="$(realpath -m -- "${GITHUB_WORKSPACE}")"  || fail_artifact_io "cannot lexical-canonicalize workspace"
          case "${ARTIFACTS_LEX}" in
            "${WORKSPACE_LEX}"|"${WORKSPACE_LEX}"/*)
              fail_artifact_io "ARTIFACTS resolves inside the worktree (lexical: ${ARTIFACTS_LEX} under ${WORKSPACE_LEX}); outside-tree routing contract violated" ;;
          esac

          # (2) External capture directory must be creatable. We choose
          #     filename as a deterministic target so the test framework can
          #     pre-create a regular file at this path to force a real
          #     mkdir-vs-file conflict (deterministic precondition, not
          #     permission lottery). Note: ${ARTIFACTS} is owned by the
          #     init step via $GITHUB_ENV propagation; the capture path
          #     IS the upload-artifact root and there is no worktree
          #     post-pass copy step.
          ART_PARENT_DIR="$(dirname "${ARTIFACTS}/checkout-identity.txt")"
          if [[ -e "$ART_PARENT_DIR" && ! -d "$ART_PARENT_DIR" ]]; then
            fail_artifact_io "external artifact root $ART_PARENT_DIR exists and is not a directory"
          fi
          if ! mkdir -p "$ART_PARENT_DIR" 2>/dev/null; then
            fail_artifact_io "could not create external artifact root $ART_PARENT_DIR"
          fi

          # (2a) Post-mkdir physical canonicalisation of
          #      ${ARTIFACTS} and ${GITHUB_WORKSPACE}.
          #      This catches: (a) the artifact root is
          #      a symlink (or contains a symlinked
          #      component) whose target is inside the
          #      worktree; (b) a parallel `realpath -m`
          #      lexical canonicalisation (above)
          #      disagreed with the resolved filesystem
          #      state. Both axis must agree AND lie
          #      outside the worktree.
          ARTIFACTS_REAL="$(realpath -e -- "${ARTIFACTS}" 2>/dev/null)" || fail_artifact_io "cannot physical-resolve ARTIFACTS (${ARTIFACTS})"
          WORKSPACE_REAL="$(realpath -e -- "${GITHUB_WORKSPACE}" 2>/dev/null)" || fail_artifact_io "cannot physical-resolve workspace"
          case "${ARTIFACTS_REAL}" in
            "${WORKSPACE_REAL}"|"${WORKSPACE_REAL}"/*)
              fail_artifact_io "ARTIFACTS resolves inside the worktree (physical: ${ARTIFACTS_REAL} under ${WORKSPACE_REAL}); outside-tree routing contract violated" ;;
          esac

          # (3) Identity capture write itself must succeed. d2b.34 writes
          #     directly into the same ${ARTIFACTS}/checkout-identity.txt
          #     path the actions/upload-artifact@v4 step will harvest —
          #     there is no longer a copy from ${RUNNER_TEMP}/<...>.txt
          #     into artifacts/ which could re-pollute the worktree.
          OUT_ID="${ARTIFACTS}/checkout-identity.txt"
          if ! {
            echo "head_sha:          $(git rev-parse HEAD)"
            echo "short_sha:         $(git rev-parse --short HEAD)"
            echo "branch:            $(git rev-parse --abbrev-ref HEAD || echo detached)"
            echo "capture_path_abs:  $OUT_ID"
            echo "artifacts_root:     $ARTIFACTS"
            echo "worktree_clean_asserted_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "clean_tree_required: yes"
            echo "porcelain_clean:"
            echo "porcelain_end"
          } > "$OUT_ID" 2>/dev/null; then
            fail_artifact_io "could not write external checkout identity to $OUT_ID"
          fi
          if [[ ! -s "$OUT_ID" ]]; then
            fail_artifact_io "external identity capture at $OUT_ID is empty or missing"
          fi

          # (4) Source-clean assertion, raw and unfiltered. ANY dirty entry
          #     in the worktree — including paths the operator does not
          #     expect — fails-closes with exit 10. We do not pipe
          #     `git status --porcelain` through grep/sed/awk to mask any
          #     path; the entire output is the subject of the judgement.
          porcelain=$(git status --porcelain || true)
          dirt=$(printf "%s" "$porcelain" | grep -cEv '^$' || true)
          if [[ "$dirt" != "0" ]]; then
            echo "FAIL: working tree has $dirt dirty entries (clean tree required)" >&2
            printf "%s\n" "$porcelain" | sed 's/^/  dirt: /' >&2
            exit 10
          fi
          # diff --exit-code returns 1 if the working tree differs from HEAD.
          if ! git diff --exit-code HEAD > /dev/null 2>&1; then
            echo "FAIL: working tree diverges from HEAD on at least one file (uncommitted tracked changes)" >&2
            exit 10
          fi
          # Append the porcelain snapshot (taken against an undisturbed
          # tree, so it must be empty) for the upload-only record. This
          # append happens AT $ARTIFACTS, not in the worktree.
          printf 'porcelain_clean_actual: %s\n' "$porcelain" >> "$OUT_ID"
          echo "OK: source tree clean (porcelain=0, diff vs HEAD clean) at $(date -u +%Y-%m-%dT%H:%M:%SZ); external capture at $OUT_ID"
          echo "OK: step A — checkout identity captured externally, working tree matches HEAD"

      - name: pin kind v0.22.0 + kubectl v1.29 + helm 3.14 + Cilium CLI v0.15 (verified)
        run: |
          set -euo pipefail
          # CNI gate rationale: the previous pin step piped
          # `curl -fsSL ... | tar -xz` and silently dropped the
          # HTTP body at the gzip stage when Azure westus3
          # cranelift stale-streamed; tar exited 2 with
          # "gzip: stdin: unexpected end of file" and the run
          # was marked failure even though the code under
          # test was correct. The gate had no digest to
          # compare against, so the operator couldn't tell a
          # flake from a real corruption.
          #
          # The new step:
          #   1) Downloads each binary into a local file
          #      (no pipe), with curl retry on transient
          #      connectivity errors;
          #   2) Verifies the published SHA256 against the
          #      file — mismatch is fail-closed and
          #      invalidates the run;
          #   3) Extracts / installs / records to the
          #      artifact folder.
          #
          # Sources of truth (captured on 2026-08-21):
          curl_common=(--retry 3 --retry-connrefused --retry-delay 5 --connect-timeout 30 --max-time 600 -fsSL)

          # --- kind v0.22.0 --------------------------------------
          # Source: https://github.com/kubernetes-sigs/kind/releases/download/v0.22.0/kind-linux-amd64.sha256sum
          curl "${curl_common[@]}" -o /tmp/kind https://kind.sigs.k8s.io/dl/v0.22.0/kind-linux-amd64
          echo 'e4264d7ee07ca642fe52818d7c0ed188b193c214889dd055c929dbcb968d1f62  /tmp/kind' | sha256sum -c --status - || { echo 'FAIL: kind v0.22.0 sha256 mismatch'; exit 1; }
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind

          # --- kubectl v1.29.0 -----------------------------------
          # Source: https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl.sha256
          curl "${curl_common[@]}" -o /tmp/kubectl https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl
          echo '0e03ab096163f61ab610b33f37f55709d3af8e16e4dcc1eb682882ef80f96fd5  /tmp/kubectl' | sha256sum -c --status - || { echo 'FAIL: kubectl v1.29.0 sha256 mismatch'; exit 1; }
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl

          # --- helm v3.14.4 --------------------------------------
          # Source: https://get.helm.sh/helm-v3.14.4-linux-amd64.tar.gz.sha256sum
          # NOTE: the archive is downloaded intact to a file
          # first (no pipe) so a gzip truncation surfaces as
          # a real tar/exit code instead of being silently
          # absorbed by the | tar pipe.
          curl "${curl_common[@]}" -o /tmp/helm.tar.gz https://get.helm.sh/helm-v3.14.4-linux-amd64.tar.gz
          echo 'a5844ef2c38ef6ddf3b5a8f7d91e7e0e8ebc39a38bb3fc8013d629c1ef29c259  /tmp/helm.tar.gz' | sha256sum -c --status - || { echo 'FAIL: helm v3.14.4 sha256 mismatch'; exit 1; }
          tar -C /tmp -xzf /tmp/helm.tar.gz linux-amd64/helm
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          rm -f /tmp/helm.tar.gz /tmp/linux-amd64/helm

          # --- cilium CLI v0.15.20 -------------------------------
          # Source: https://github.com/cilium/cilium-cli/releases/download/v0.15.20/cilium-linux-amd64.tar.gz.sha256sum
          curl "${curl_common[@]}" -o /tmp/cilium.tar.gz https://github.com/cilium/cilium-cli/releases/download/v0.15.20/cilium-linux-amd64.tar.gz
          echo 'a1a09f3f0176e118b1b00be4fcd7f9f32f27c9587c64b5579d2747d751e72e23  /tmp/cilium.tar.gz' | sha256sum -c --status - || { echo 'FAIL: cilium v0.15.20 sha256 mismatch'; exit 1; }
          tar -C /tmp -xzf /tmp/cilium.tar.gz
          sudo install -m 0755 /tmp/cilium /usr/local/bin/cilium
          rm -f /tmp/cilium.tar.gz /tmp/cilium

          kind version
          kubectl version --client
          helm version
          cilium version
          echo "Pinned: kind v0.22.0 | kubectl v1.29.0 | helm v3.14.4 | cilium v0.15.20 (sha256-verified, retry=3)"
          # d2b.34: pinned-versions.txt is written to
          # the heavy-job ${ARTIFACTS} root (published
          # by the dedicated init step via $GITHUB_ENV),
          # NOT to ${GITHUB_WORKSPACE}/artifacts/integrationcni
          # which the fixture preflight raw porcelain
          # assertion would otherwise read as real source dirt.
          mkdir -p "${ARTIFACTS}"
          {
            echo "kind: $(kind version | head -1)"
            echo "kubectl: $(kubectl version --client=true --short 2>/dev/null || kubectl version --client | head -1)"
            echo "helm: $(helm version --short)"
            echo "cilium: $(cilium version | head -1)"
            echo "k8s node image: kindest/node:v1.29.0  (script default)"
            echo "sha:  $(git rev-parse HEAD)"
            echo "run:  ${{ github.event.inputs.run_index }}"
            echo "artifacts_root: ${ARTIFACTS}"
            echo "pin-policy: curl retry=3 + sha256 verify of upstream-published sums"
          } > "${ARTIFACTS}/pinned-versions.txt"

      - name: Bring up multi-node kind + Cilium cluster
        run: bash scripts/test-cluster-up.sh
        env:
          KUBE_WORKER_COUNT: 2

      - name: Install chart with enterprise profile
        if: success()
        run: bash scripts/install-nexus-test.sh

      - name: Run enforcing-CNI scenarios (three-tier probe)
        if: success()
        run: bash scripts/d2b-twelve-scenarios.sh

      - name: Helm upgrade rehearsal (disabled -> enforce + --atomic rollback)
        if: success()
        run: bash scripts/test-upgrade-rehearsal-up.sh

      - name: Tear down cluster (always)
        if: always()
        run: bash scripts/test-cluster-down.sh || true

      - name: Upload CNI gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cni-enforcement-logs-${{ github.event.inputs.run_index }}-${{ github.event.inputs.recovery_pr_sha }}-${{ github.run_id }}
          path: ${{ env.ARTIFACTS }}/
          if-no-files-found: error
          retention-days: 90
